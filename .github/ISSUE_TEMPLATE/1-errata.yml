name: 勘誤回報 / Erratum
description: 回報錯字、技術錯誤或過時的內容 / Report a typo, a technical error or outdated content
title: "[勘誤] "
labels: ["errata"]
body:
  - type: markdown
    attributes:
      value: |
        感謝你幫忙找出錯誤！修正技術內容時，請盡量附上公開的參考資料。
        Thank you for helping us fix mistakes! Please include public references for technical corrections.
  - type: dropdown
    id: language
    attributes:
      label: 版本 / Version
      options:
        - 繁體中文 / Traditional Chinese
        - English
        - 兩者 / Both
    validations:
      required: true
  - type: dropdown
    id: chapter
    attributes:
      label: 章節 / Chapter
      options:
        - "第 0 章 半導體製造全景 / Ch. 0 The Big Picture"
        - "第 1 章 晶圓廠如何運作 / Ch. 1 How a Fab Works"
        - "第 2 章 從物理到電晶體 / Ch. 2 From Physics to Transistors"
        - "第 3 章 從沙子到晶圓 / Ch. 3 From Sand to Wafer"
        - "第 4 章 微影 / Ch. 4 Lithography"
        - "第 5 章 薄膜 / Ch. 5 Thin Films"
        - "第 6 章 蝕刻 / Ch. 6 Etching"
        - "第 7 章 離子佈植與熱處理 / Ch. 7 Ion Implantation and Thermal Processing"
        - "第 8 章 CMP / Ch. 8 CMP"
        - "第 9 章 清洗與污染控制 / Ch. 9 Cleaning and Contamination Control"
        - "第 10 章 金屬化 / Ch. 10 Metallization"
        - "第 11 章 走一遍完整的 CMOS 流程 / Ch. 11 A Complete CMOS Process Flow"
        - "第 12 章 先進電晶體結構 / Ch. 12 Advanced Transistor Structures"
        - "第 13 章 記憶體製程 / Ch. 13 Memory Processes"
        - "第 14 章 「幾奈米」是什麼意思 / Ch. 14 What Does 3 nm Really Mean?"
        - "第 15 章 量測與檢測 / Ch. 15 Metrology and Inspection"
        - "第 16 章 良率與故障分析 / Ch. 16 Yield and Failure Analysis"
        - "第 17 章 製程控制 / Ch. 17 Process Control"
        - "第 18 章 異常處理與工程變更 / Ch. 18 Handling Abnormalities and Engineering Changes"
        - "第 19 章 晶圓測試 / Ch. 19 Wafer Test"
        - "第 20 章 封裝 / Ch. 20 Packaging"
        - "第 21 章 先進封裝 / Ch. 21 Advanced Packaging"
        - "第 22 章 最終測試與可靠度 / Ch. 22 Final Test and Reliability"
        - "第 23 章 工廠如何被系統管理 / Ch. 23 How Systems Run the Fab"
        - "第 24 章 製程如何影響韌體 / Ch. 24 How the Process Shapes Firmware"
        - "附錄 A 術語總表 / Appendix A Glossary"
        - "附錄 B 現場行話 / Appendix B Fab Jargon"
        - "附錄 C 延伸閱讀 / Appendix C Further Reading"
        - "README 或其他專案文件 / README or other project documents"
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: 原文 / Original text
      description: 請貼上有問題的句子 / Paste the sentence that has the problem
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建議的修改 / Suggested correction
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 依據或參考資料 / References
      description: 例如教科書、論文或產業標準 / e.g. textbooks, papers or industry standards
  - type: checkboxes
    id: confidentiality
    attributes:
      label: 確認 / Confirmation
      options:
        - label: 我提供的內容不包含任何公司的機密資訊 / My report contains no confidential information of any company
          required: true
