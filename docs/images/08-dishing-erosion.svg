<text class="t" x="270" y="388" font-size="14" text-anchor="middle" fill="#26282b">Wide line</text>
<text class="t" x="610" y="388" font-size="14" text-anchor="middle" fill="#26282b">Dense narrow lines</text>
<text class="t" x="90" y="388" font-size="14" text-anchor="middle" fill="#26282b">Sparse area</text>
<text class="t" x="60" y="345" font-size="13" fill="#3b4655">dielectric (hard)</text>
<rect x="440" y="334" width="14" height="14" fill="#d98a4a" stroke="#9a5524"/><text class="t" x="460" y="346" font-size="13" fill="#26282b">copper (soft)</text>
<rect x="40" y="410" width="880" height="1" fill="#d5d8dd"/>
<text class="t" x="40" y="441" font-size="15" font-weight="700" fill="#26282b">Over-polish time</text>
<rect x="260" y="428" width="340" height="14" rx="3" fill="#e1e4e8"/>
<g class="anim"><rect x="260" y="428" height="14" fill="var(--hot)" rx="3" width="289"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.1;0.2;0.3;0.8;0.9;1" values="289;289;0;0;340;340;289"/></rect></g><g class="static"><rect x="260" y="428" height="14" fill="#d6322a" rx="3" width="289"/></g>
<text class="t" x="260" y="462" font-size="12" fill="#5b6068">endpoint</text>
<text class="t" x="600" y="462" font-size="12" text-anchor="end" fill="#5b6068">long over-polish (illustrative)</text>
<g class="anim"><text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="0">At the endpoint: the surface is flat (shown as the dashed line).<animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.34;1" values="0;1;0;0"/></text>
<text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="0">Keep polishing past the endpoint (over-polish): soft copper wears away faster than the hard dielectric.<animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.34;0.6;1" values="0;1;0;0"/></text>
<text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="1">Long over-polish: a dip in the wide line (dishing), and the dense area sits lower than the field (erosion).<animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.6;1" values="1;0;1;1"/></text></g><g class="static"><text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="0">At the endpoint: the surface is flat (shown as the dashed line).</text>
<text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="0">Keep polishing past the endpoint (over-polish): soft copper wears away faster than the hard dielectric.</text>
<text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="1">Long over-polish: a dip in the wide line (dishing), and the dense area sits lower than the field (erosion).</text></g>
<text class="t" x="40" y="526" font-size="14" fill="#26282b"><tspan font-weight="700">Why:</tspan> soft metal polishes faster than hard dielectric, and dense areas polish differently from sparse ones.</text>
<text class="t" x="40" y="550" font-size="14" fill="#26282b"><tspan font-weight="700">Result:</tspan> thinner wires and higher resistance. Dummy fill evens out pattern density to reduce this.</text>
<text class="t" x="40" y="580" font-size="12" fill="#5b6068">Depths drawn are illustrative, not measured data.</text>
</svg>