<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="tt dd">
<title id="tt">Dishing and erosion in copper CMP</title>
<desc id="dd">Cross-section animation: as over-polish time grows, a wide copper line dips in the middle (dishing) and a dense array of copper lines sinks below the surrounding surface (erosion).</desc>
<style>
svg{--bg:#fbfaf7;--ink:#26282b;--mut:#5b6068;--di:#c9d3df;--cu:#d98a4a;--cu2:#9a5524;--hot:#d6322a;--panel:#eef0f3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.static{display:none}
@media (prefers-reduced-motion:reduce){.anim{display:none}.static{display:inline}}
</style>
<rect width="960" height="600" fill="#fbfaf7"/>
<text class="t" x="40" y="36" font-size="22" font-weight="700" fill="#26282b">Dishing and erosion: what over-polishing does</text>
<text class="t" x="40" y="60" font-size="14" fill="#5b6068">Cross-section of one copper wiring layer after CMP (schematic, illustrative scale)</text>
<g style="--ink:#26282b">
<text class="t" x="270" y="128" font-size="17" font-weight="700" text-anchor="middle" fill="#d6322a">DISHING</text>
<text class="t" x="270" y="148" font-size="14" text-anchor="middle" fill="#26282b">dip inside one wide line</text>
<text class="t" x="610" y="128" font-size="17" font-weight="700" text-anchor="middle" fill="#d6322a">EROSION</text>
<text class="t" x="610" y="148" font-size="14" text-anchor="middle" fill="#26282b">whole dense area sits lower</text>
<line x1="270" y1="156" x2="270" y2="190" stroke="#8a8f98" stroke-width="1"/>
<line x1="610" y1="156" x2="610" y2="190" stroke="#8a8f98" stroke-width="1"/>
<text class="t" x="926" y="196" font-size="12" text-anchor="end" fill="#26282b">original flat level</text>
</g>
