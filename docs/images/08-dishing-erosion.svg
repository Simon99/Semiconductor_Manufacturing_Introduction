<path fill="var(--cu)" stroke="var(--cu2)" stroke-width="1" d="M490,310 H510 V244.2 H490Z M530,310 H550 V244.2 H530Z M570,310 H590 V244.2 H570Z M610,310 H630 V244.2 H610Z M650,310 H670 V244.2 H650Z M690,310 H710 V244.2 H690Z M730,310 H750 V244.2 H730Z"/>
