<line x1="770" x2="866" stroke="var(--hot)" stroke-width="1.5" stroke-dasharray="5 4" y1="239.1" y2="239.1"><animate attributeName="y1" dur="14s" repeatCount="indefinite" keyTimes="0;0.1;0.2;0.3;0.8;0.9;1" values="239.1;239.1;200;200;246;246;239.1"/><animate attributeName="y2" dur="14s" repeatCount="indefinite" keyTimes="0;0.1;0.2;0.3;0.8;0.9;1" values="239.1;239.1;200;200;246;246;239.1"/></line></g>
