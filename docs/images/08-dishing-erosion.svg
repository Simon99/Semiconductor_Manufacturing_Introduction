<line x1="40" y1="200" x2="920" y2="200" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="6 5" opacity=".6"/>
<rect x="268" width="5" fill="var(--hot)" y="200" height="34"><animate attributeName="height" dur="14s" repeatCount="indefinite" keyTimes="0;0.1;0.2;0.3;0.8;0.9;1" values="34;34;0;0;40;40;34"/></rect>
