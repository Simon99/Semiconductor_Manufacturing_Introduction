<clipPath id="clA"><rect x="30" y="130" width="290" height="320" rx="6"/></clipPath>
<clipPath id="clB"><rect x="370" y="130" width="290" height="320" rx="6"/></clipPath>
<marker id="ar" markerWidth="6" markerHeight="6" refX="3" refY="3"><circle cx="3" cy="3" r="0"/></marker>
</defs>
