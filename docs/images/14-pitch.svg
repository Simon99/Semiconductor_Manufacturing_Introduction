<text class="t hd" x="30" y="476" font-size="16">Gate layer</text>
<text class="m" x="30" y="496" font-size="13">gates (orange) over fins (blue), contacts (green)</text>
<text class="m" x="30" y="514" font-size="13">CPP = gate-to-gate pitch</text>
<text class="t hd" x="370" y="476" font-size="16">Densest metal layer</text>
<text class="m" x="370" y="496" font-size="13">wires (blue); MMP = wire-to-wire pitch</text>
<text class="m" x="370" y="514" font-size="13">pitch = line + space</text>
<rect x="700" y="130" width="230" height="320" rx="6" fill="#ffffff" stroke="#9aa3b5"/>
<text class="m" x="716" y="164" font-size="14">Gate pitch (CPP)</text>
<text class="t hd oa" x="716" y="194" font-size="26">48 nm</text>
<text class="t hd ob" x="716" y="194" font-size="26">34 nm</text>
<text class="m" x="716" y="234" font-size="14">Metal pitch (MMP)</text>
<text class="t hd oa" x="716" y="264" font-size="26">30 nm</text>
<text class="t hd ob" x="716" y="264" font-size="26">21 nm</text>
<text class="m" x="716" y="304" font-size="14">Relative density</text>
<text class="t hd oa" x="716" y="334" font-size="26">1.0x</text>
<text class="t hd ob" x="716" y="334" font-size="26">~2.0x</text>
<rect x="716" y="348" width="100" height="16" rx="3" fill="#2f8a5b" class="bar"/>
<text class="m" x="716" y="392" font-size="13">density ~ 1 / (CPP x MMP)</text>
<text class="m" x="716" y="412" font-size="13">0.7 x 0.7 = 0.49 area, so</text>
<text class="m" x="716" y="430" font-size="13">about 2x the transistors</text>
<text class="m" x="30" y="538" font-size="13">Illustrative values. Node names such as "3 nm" are generation labels, not these dimensions.</text>
