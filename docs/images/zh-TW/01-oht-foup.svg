<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant-TW" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">天車（OHT）把 FOUP 放到機台的 Load Port 上</title>
<desc id="d">天車沿天花板軌道從倉儲駛向機台，用吊掛機構把 FOUP 放到 Load Port 上，再回去載下一個 FOUP。時間為示意。</desc>
<style>
.bg{fill:#101c2e}.ceil{fill:#233248}.rail{fill:#8795ab}.rail2{fill:#b9c4d6}
.hang{fill:#4a5a74}.body{fill:#e8a23a}.dark{fill:#1b2a40}
.tool{fill:#35506e;stroke:#6f8fb3;stroke-width:2}.ledge{fill:#8fa6c2}
.stk{fill:#2d4663;stroke:#6f8fb3;stroke-width:2}.slot{fill:#223a55}
.floor{fill:#2b3d57}.grip{fill:#6b7c96}.belt{fill:#cfd8e6}
.foup{fill:#58b8f0;stroke:#d8f1ff;stroke-width:2}.fl{fill:#d8f1ff}.fline{stroke:#1e5f8a;stroke-width:2}
.txt{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#e6eefb}
.sm{font-size:14px}.cap{font-size:13px}.num{font-size:15px;font-weight:700;fill:#ffd27a}
.led{fill:#3ddc84}
#veh{transform:translateX(545px);animation:veh 12s linear infinite}
#hoist{transform:translateY(150px);animation:hoist 12s linear infinite}
#carry{opacity:1;animation:carry 12s linear infinite}
#portf{opacity:0;animation:portf 12s linear infinite}
#stkf{opacity:0;animation:stkf 12s linear infinite}
#led2{opacity:.25;animation:led2 12s linear infinite}
@keyframes veh{0%,24%{transform:translateX(545px)}50%,70%{transform:translateX(110px)}94%,100%{transform:translateX(545px)}}
@keyframes hoist{0%{transform:translateY(150px)}7%,10%{transform:translateY(172px)}24%,50%{transform:translateY(0)}58%,62%{transform:translateY(22px)}70%,94%{transform:translateY(0)}100%{transform:translateY(150px)}}
@keyframes carry{0%,6.9%{opacity:1}7%,57.9%{opacity:0}58%,100%{opacity:1}}
@keyframes portf{0%,6.9%{opacity:0}7%,90%{opacity:1}95%,100%{opacity:0}}
@keyframes stkf{0%,24%{opacity:0}30%,57.9%{opacity:1}58%,100%{opacity:0}}
@keyframes led2{0%,6.9%{opacity:.25}7%,90%{opacity:1}95%,100%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#veh,#hoist,#carry,#portf,#stkf,#led2{animation:none}}
</style>
<defs>
<g id="foup"><rect class="fl" x="-12" y="121" width="24" height="7" rx="2"/><rect class="foup" x="-26" y="127" width="52" height="61" rx="5"/>
<rect class="fline" x="-18" y="170" width="36" height="0"/><path class="fline" d="M-18 168H18M-18 175H18M-18 182H18" fill="none"/><rect class="fl" x="19" y="132" width="5" height="30" rx="2"/>
<text class="txt cap" x="-3" y="152" text-anchor="middle" style="fill:#08263d;font-weight:700">FOUP</text></g>
<clipPath id="below"><rect x="-50" y="110" width="100" height="700"/></clipPath>
</defs>
<rect class="bg" width="960" height="540"/>
<rect class="ceil" width="960" height="44"/>
<text class="txt sm" x="20" y="28">晶圓廠天花板：天車軌道</text>

<rect class="hang" x="40" y="44" width="8" height="12"/>
<rect class="hang" x="160" y="44" width="8" height="12"/>
<rect class="hang" x="280" y="44" width="8" height="12"/>
<rect class="hang" x="400" y="44" width="8" height="12"/>
<rect class="hang" x="520" y="44" width="8" height="12"/>
<rect class="hang" x="640" y="44" width="8" height="12"/>
<rect class="hang" x="760" y="44" width="8" height="12"/>
<rect class="hang" x="880" y="44" width="8" height="12"/>
<rect class="rail" x="0" y="56" width="960" height="12"/><rect class="rail2" x="0" y="56" width="960" height="3"/>
<rect class="floor" x="0" y="470" width="960" height="10"/>
<rect class="stk" x="30" y="210" width="160" height="260" rx="4"/>
<rect class="slot" x="46" y="228" width="56" height="58" rx="4"/><rect class="foup" x="54" y="236" width="40" height="42" rx="4" opacity=".55"/>
<rect class="slot" x="118" y="228" width="56" height="58" rx="4"/><rect class="foup" x="126" y="236" width="40" height="42" rx="4" opacity=".55"/>
<rect class="slot" x="46" y="298" width="56" height="58" rx="4"/><rect class="foup" x="54" y="306" width="40" height="42" rx="4" opacity=".55"/>
<rect class="slot" x="118" y="298" width="56" height="58" rx="4"/><rect class="foup" x="126" y="306" width="40" height="42" rx="4" opacity=".55"/>
<rect class="slot" x="46" y="368" width="56" height="58" rx="4"/><rect class="foup" x="54" y="376" width="40" height="42" rx="4" opacity=".55"/>
<rect class="slot" x="118" y="368" width="56" height="58" rx="4"/><rect class="foup" x="126" y="376" width="40" height="42" rx="4" opacity=".55"/>
<text class="txt sm" x="110" y="458" text-anchor="middle" style="font-weight:700">倉儲</text>
<g id="stkf"><use href="#foup" transform="translate(110,22)"/></g>
<rect class="ledge" x="250" y="360" width="90" height="12" rx="2"/>
<rect class="tool" x="340" y="300" width="110" height="170" rx="4"/>
<rect class="ledge" x="340" y="304" width="6" height="56"/>
<text class="txt sm" x="398" y="420" text-anchor="middle" style="font-weight:700">機台 A</text>
<circle class="led" cx="430" cy="322" r="6" opacity=".25"/>
<rect class="ledge" x="500" y="360" width="90" height="12" rx="2"/>
<rect class="tool" x="590" y="300" width="110" height="170" rx="4"/>
<rect class="ledge" x="590" y="304" width="6" height="56"/>
<text class="txt sm" x="648" y="420" text-anchor="middle" style="font-weight:700">機台 B</text>
<circle class="led" cx="680" cy="322" r="6" id="led2"/>
<rect class="ledge" x="740" y="360" width="90" height="12" rx="2"/>
<rect class="tool" x="830" y="300" width="110" height="170" rx="4"/>
<rect class="ledge" x="830" y="304" width="6" height="56"/>
<text class="txt sm" x="888" y="420" text-anchor="middle" style="font-weight:700">機台 C</text>
<circle class="led" cx="920" cy="322" r="6" opacity="1"/>
<use href="#foup" transform="translate(785,172)"/>
<g id="portf"><use href="#foup" transform="translate(545,172)"/></g>
<path d="M545 398V376" stroke="#ffd27a" stroke-width="2" fill="none"/><text class="txt sm" x="545" y="414" text-anchor="middle" style="fill:#ffd27a">Load Port</text>
<g id="veh"><g clip-path="url(#below)"><g id="hoist"><rect class="belt" x="-24" y="-300" width="4" height="412"/><rect class="belt" x="20" y="-300" width="4" height="412"/>
<rect class="grip" x="-34" y="110" width="68" height="14" rx="3"/><rect class="grip" x="-34" y="124" width="6" height="10"/><rect class="grip" x="28" y="124" width="6" height="10"/>
<g id="carry"><use href="#foup"/></g></g></g>
<circle cx="-26" cy="62" r="6" fill="#d9e2f0"/><circle cx="26" cy="62" r="6" fill="#d9e2f0"/>
<rect class="body" x="-42" y="68" width="84" height="42" rx="7"/><rect class="dark" x="-42" y="100" width="84" height="10" rx="3"/>
<text class="txt" x="0" y="92" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#1b2a40">OHT</text></g>
<text class="txt cap" x="30" y="505" style="font-weight:700">1　天車沿天花板軌道行駛</text><text class="txt cap" x="30" y="524" style="opacity:.8">從倉儲載運到機台</text>
<text class="txt cap" x="335" y="505" style="font-weight:700">2　吊掛機構放下密封的 FOUP</text><text class="txt cap" x="335" y="524" style="opacity:.8">最多 25 片晶圓，約 8 公斤</text>
<text class="txt cap" x="650" y="505" style="font-weight:700">3　Load Port 接收 FOUP</text><text class="txt cap" x="650" y="524" style="opacity:.8">機台在潔淨空間內開盒</text>
</svg>