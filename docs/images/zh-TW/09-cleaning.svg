<text class="sm" x="286" y="392" text-anchor="middle">SC2</text>
<rect x="342" y="278" width="92" height="92" fill="#7fe3ff" opacity=".55"/>
<path d="M342 250V370H434V250" fill="none" stroke="#c9d6e8" stroke-width="4" stroke-linejoin="round"/>
<text class="sm" x="388" y="392" text-anchor="middle">超純水沖洗</text>
<circle class="bub" cx="54" cy="350" r="4" fill="#fff" style="animation-delay:0.0s"/>
<circle class="bub" cx="82" cy="350" r="4" fill="#fff" style="animation-delay:0.7s"/>
<circle class="bub" cx="108" cy="350" r="4" fill="#fff" style="animation-delay:1.4s"/>
<circle class="bub" cx="258" cy="350" r="4" fill="#fff" style="animation-delay:0.0s"/>
<circle class="bub" cx="286" cy="350" r="4" fill="#fff" style="animation-delay:0.7s"/>
<circle class="bub" cx="312" cy="350" r="4" fill="#fff" style="animation-delay:1.4s"/>
<g transform="translate(82,0)"><g id="carrier">
<line x1="0" y1="132" x2="0" y2="164" stroke="#c9d6e8" stroke-width="4"/>
<rect x="-34" y="164" width="68" height="70" rx="6" fill="none" stroke="#c9d6e8" stroke-width="3"/>
<rect x="-27" y="170" width="5" height="58" rx="2" fill="#dfe8f4"/>
<rect class="spread" x="-27" y="170" width="5" height="58" rx="2" fill="#ff5a5a"/>
