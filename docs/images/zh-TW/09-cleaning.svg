<circle class="rip" cx="715" cy="235" r="85" fill="none" stroke-width="3" style="animation-delay:0.4s,0s"/>
<circle class="rip" cx="715" cy="235" r="85" fill="none" stroke-width="3" style="animation-delay:0.8s,0s"/>
<g class="fling">
