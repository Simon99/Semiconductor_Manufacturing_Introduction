<rect x="13" y="170" width="5" height="58" rx="2" fill="#dfe8f4"/>
<rect class="spread" x="13" y="170" width="5" height="58" rx="2" fill="#ff5a5a"/>
<rect x="23" y="170" width="5" height="58" rx="2" fill="#dfe8f4"/>
<rect class="spread" x="23" y="170" width="5" height="58" rx="2" fill="#ff5a5a"/>
<circle class="drift" cx="-5" cy="200" r="3" fill="#ff5a5a" style="--dx:-24px;--dy:-8px;animation-delay:0.0s"/>
<circle class="drift" cx="-5" cy="200" r="3" fill="#ff5a5a" style="--dx:22px;--dy:10px;animation-delay:0.4s"/>
<circle class="drift" cx="-5" cy="200" r="3" fill="#ff5a5a" style="--dx:-18px;--dy:16px;animation-delay:0.8s"/>
<circle class="drift" cx="-5" cy="200" r="3" fill="#ff5a5a" style="--dx:26px;--dy:-12px;animation-delay:1.2000000000000002s"/>
<circle class="drift" cx="-5" cy="200" r="3" fill="#ff5a5a" style="--dx:0px;--dy:20px;animation-delay:1.6s"/>
</g></g>
<text class="sm dim" x="36" y="410">紅色晶圓把微粒釋放到共用藥槽中，</text>
<text class="sm dim" x="36" y="426">載具內每一片晶圓都會沾染到。</text>
<text class="sm" x="454" y="124" text-anchor="end">吊臂與晶圓載具</text>
<circle cx="715" cy="235" r="122" fill="#0f1b2d" stroke="#c9d6e8" stroke-width="5"/>
<circle cx="715" cy="235" r="100" fill="none" stroke="#6f86a8" stroke-width="2" stroke-dasharray="4 6"/>
<circle cx="715" cy="235" r="85" fill="#cfd9e8"/>
<circle class="film" cx="715" cy="235" r="85" opacity=".6" fill="#4aa3ff"/>
<g class="spin">
<line x1="745.0" y1="235.0" x2="793.0" y2="235.0" stroke="#14233a" stroke-width="2" opacity=".5"/>
<line x1="700.0" y1="261.0" x2="676.0" y2="302.5" stroke="#14233a" stroke-width="2" opacity=".5"/>
<line x1="700.0" y1="209.0" x2="676.0" y2="167.5" stroke="#14233a" stroke-width="2" opacity=".5"/>
<circle cx="795" cy="235" r="5" fill="#14233a"/>
