<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant-TW" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">批次式濕式清洗槽與單片式旋轉清洗對照</title>
<desc id="d">左側：一批晶圓的載具逐槽浸入共用藥槽，污染會擴散到每一片晶圓。右側：單片晶圓一邊旋轉、一邊噴灑新鮮化學品，彼此不共用任何東西。長條為示意。</desc>
<style>
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e8f0fa}
.sm{font-size:12px} .md{font-size:14px} .hd{font-size:18px;font-weight:700} .dim{fill:#a9bcd6}
#carrier{animation:car 12s linear infinite}
@keyframes car{
0% {transform:translate(0px,0px)}
3% {transform:translate(0px,90px)}
15% {transform:translate(0px,90px)}
18% {transform:translate(0px,0px)}
22% {transform:translate(102px,0px)}
25% {transform:translate(102px,90px)}
37% {transform:translate(102px,90px)}
40% {transform:translate(102px,0px)}
44% {transform:translate(204px,0px)}
47% {transform:translate(204px,90px)}
59% {transform:translate(204px,90px)}
62% {transform:translate(204px,0px)}
66% {transform:translate(306px,0px)}
69% {transform:translate(306px,90px)}
81% {transform:translate(306px,90px)}
84% {transform:translate(306px,0px)}
88% {transform:translate(306px,0px)}
100% {transform:translate(0px,0px)}
}
.spread{animation:spr 12s linear infinite}
@keyframes spr{0%{opacity:0}30%{opacity:.75}88%{opacity:.75}100%{opacity:0}}
.drift{animation:drf 2.4s ease-in-out infinite}
@keyframes drf{0%,100%{transform:translate(0,0);opacity:.9}50%{transform:translate(var(--dx),var(--dy));opacity:.5}}
.bub{animation:bub 2.2s ease-in infinite}
@keyframes bub{0%{transform:translateY(0);opacity:.0}20%{opacity:.8}100%{transform:translateY(-70px);opacity:0}}
.spin{transform-origin:715px 235px;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.film{animation:film 12s linear infinite}
@keyframes film{0%,24%{fill:#4aa3ff}25%,49%{fill:#7fe3ff}50%,74%{fill:#7be08a}75%,89%{fill:#7fe3ff}90%,100%{fill:#9aa6b8}}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 1.2s ease-out infinite, rcol 12s linear infinite}
@keyframes rip{0%{transform:scale(.06);opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes rcol{0%,24%{stroke:#4aa3ff}25%,49%{stroke:#7fe3ff}50%,74%{stroke:#7be08a}75%,89%{stroke:#7fe3ff}90%,100%{stroke:#9aa6b8}}
.dirt{animation:dirt 12s linear infinite}
@keyframes dirt{0%,15%{opacity:1}60%,100%{opacity:0}}
.fling{animation:fl 12s linear infinite}
@keyframes fl{0%,55%{opacity:1}60%,100%{opacity:0}}
.out{animation:out 1.5s ease-out infinite;transform-box:fill-box}
@keyframes out{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.chip{animation:chip 12s linear infinite}
@keyframes chip{0%,24%{opacity:1}25%,100%{opacity:.28}}
.nxt{animation:nxt 2s ease-in-out infinite}
@keyframes nxt{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 #carrier{transform:translate(0,90px)}
 .spread{opacity:.75} .chip{opacity:1}
 .film{fill:#4aa3ff} .rip{opacity:.35;transform:scale(.6);stroke:#4aa3ff}
}
</style>
<rect width="960" height="540" fill="#14233a"/>
<text class="hd" x="480" y="34" text-anchor="middle">兩種清洗晶圓的方式</text>
<rect x="20" y="52" width="450" height="450" rx="14" fill="#1b2f4d"/>
<rect x="490" y="52" width="450" height="450" rx="14" fill="#1b2f4d"/>
<text class="hd" x="36" y="82">批次式濕式清洗槽</text>
<text class="sm dim" x="36" y="102">整批晶圓逐槽浸入，像洗車流水線</text>
<text class="hd" x="506" y="82">單片式旋轉清洗</text>
<text class="sm dim" x="506" y="102">一次一片：旋轉並噴灑新鮮化學品</text>
<line x1="36" y1="132" x2="454" y2="132" stroke="#6f86a8" stroke-width="3"/>

