<circle class="out" cx="759.0" cy="158.8" r="3.5" fill="#ff5a5a" style="--dx:17.0px;--dy:-29.4px;animation-delay:0.8s"/>
</g>
<path d="M805 140 L729 219" stroke="#e8f0fa" stroke-width="9" stroke-linecap="round"/><circle cx="725" cy="215" r="7" fill="#e8f0fa"/>
<text class="sm" x="810" y="132" >噴嘴</text>
