<circle class="nxt" cx="530" cy="225" r="20" fill="#dfe8f4" style="animation-delay:0.3s"/>
<circle class="nxt" cx="530" cy="280" r="20" fill="#dfe8f4" style="animation-delay:0.6s"/>
<text class="sm" x="530" y="322" text-anchor="middle">待洗</text><text class="sm" x="530" y="338" text-anchor="middle">晶圓</text>
<text class="sm" x="878" y="292" text-anchor="middle">微粒被</text><text class="sm" x="878" y="308" text-anchor="middle">甩向</text><text class="sm" x="878" y="324" text-anchor="middle">排水口</text>
<g><g class="chip" style="animation-delay:0s"><rect x="506" y="380" width="98" height="26" rx="13" fill="#4aa3ff"/><text class="sm" x="555" y="397" text-anchor="middle" style="fill:#0b1626;font-weight:700">SC1</text></g></g>
<g><g class="chip" style="animation-delay:-9s"><rect x="614" y="380" width="98" height="26" rx="13" fill="#7fe3ff"/><text class="sm" x="663" y="397" text-anchor="middle" style="fill:#0b1626;font-weight:700">沖洗</text></g></g>
<g><g class="chip" style="animation-delay:-6s"><rect x="722" y="380" width="98" height="26" rx="13" fill="#7be08a"/><text class="sm" x="771" y="397" text-anchor="middle" style="fill:#0b1626;font-weight:700">SC2</text></g></g>
<g><g class="chip" style="animation-delay:-3s"><rect x="830" y="380" width="98" height="26" rx="13" fill="#9aa6b8"/><text class="sm" x="879" y="397" text-anchor="middle" style="fill:#0b1626;font-weight:700">沖洗＋乾燥</text></g></g>
