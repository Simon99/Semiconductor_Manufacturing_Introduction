<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant-TW" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="動畫：電遷移推動金屬原子沿導線移動，直到形成空洞、導線斷裂；側邊面板輪流介紹 TDDB、HCI 與 BTI。">
<title>加速老化：電遷移</title><desc>示意動畫：電流中的電子推動金屬原子，上游形成空洞、下游堆積成小丘，最後導線開路；右側輪流說明 TDDB、HCI 與 BTI 三種老化機制，下方列出加速測試、HTOL 與 FIT。</desc>
