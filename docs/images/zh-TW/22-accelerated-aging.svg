</g></g>
<text class="cap1" x="40" y="400" font-size="16" fill="#e2e8f0" opacity="1">1  電流通過：電子流推動金屬原子（稱為「電子風」）。</text>
<text class="cap2" x="40" y="400" font-size="16" fill="#e2e8f0" opacity="0">2  原子順流漂移：上游形成空洞，下游堆積成小丘。</text>
<text class="cap3" x="40" y="400" font-size="16" fill="#e2e8f0" opacity="0">3  空洞持續擴大，直到橫跨整條導線。</text>
<text class="cap4" x="40" y="400" font-size="16" fill="#e2e8f0" opacity="0">4  導線斷開：電流中斷，晶片失效（開路）。</text>
<rect x="40" y="425" width="300" height="95" rx="10" fill="#1e293b" stroke="#334155"/><text x="54" y="449" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="700" >加速測試</text><text x="54" y="471" font-size="13" fill="#e2e8f0" text-anchor="start" font-weight="400" >提高溫度、電壓與濕度，</text><text x="54" y="490" font-size="13" fill="#e2e8f0" text-anchor="start" font-weight="400" >讓失效更快發生；</text><text x="54" y="509" font-size="13" fill="#e2e8f0" text-anchor="start" font-weight="400" >再用模型推算正常使用的壽命。</text><rect x="358" y="425" width="264" height="95" rx="10" fill="#1e293b" stroke="#334155"/><text x="372" y="449" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="700" >高溫操作壽命（HTOL）</text><text x="372" y="471" font-size="13" fill="#e2e8f0" text-anchor="start" font-weight="400" >在高溫下持續通電運作</text><text x="372" y="490" font-size="13" fill="#e2e8f0" text-anchor="start" font-weight="400" >1000 小時以上。</text><rect x="640" y="425" width="280" height="95" rx="10" fill="#1e293b" stroke="#334155"/><text x="654" y="449" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="700" >FIT</text><text x="654" y="471" font-size="13" fill="#e2e8f0" text-anchor="start" font-weight="400" >每 10⁹ 個元件小時發生</text><text x="654" y="490" font-size="13" fill="#e2e8f0" text-anchor="start" font-weight="400" >的失效次數（失效率單位）。</text>
</svg>