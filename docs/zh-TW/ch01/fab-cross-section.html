<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晶圓（Wafer）廠（Fab）剖面圖</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#1f2d3d;--mute:#51627a;--line:#c5d0de;--accent:#2a6db0;--accent-ink:#fff;--warn:#d9480f;--ok:#1f8f5f}
:root[data-theme="dark"]{--bg:#0f1621;--card:#18222f;--ink:#e6edf5;--mute:#9db0c6;--line:#2c3b4e;--accent:#5aa7e8;--accent-ink:#0b1420;--warn:#ff7a3d;--ok:#4cc38a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:10px 16px 0;max-width:1280px;margin:0 auto}
header a{color:var(--accent);text-decoration:none;font-size:14px}
header a:hover{text-decoration:underline}
h1{font-size:20px;margin:4px 0 8px}
main{max-width:1280px;margin:0 auto;padding:0 16px 16px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
#stage canvas{display:block;width:100%;height:auto;border-radius:6px}
.panel h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px;cursor:pointer;min-height:36px}
.steps button{font-size:13px}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#stext{margin:0 0 6px;min-height:7.2em;font-size:13.5px;line-height:1.4}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 0}
.row label{font-size:14px}
.row output{font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
#sw{display:flex;align-items:center;gap:10px;width:100%;justify-content:space-between;font-weight:600}
#sw .knob{width:44px;height:24px;border-radius:12px;background:var(--mute);position:relative;transition:background .15s}
#sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
#sw[aria-checked="true"] .knob{background:var(--ok)}
#sw[aria-checked="true"] .knob::after{left:23px}
#sw{background:var(--card);color:var(--ink)}
.btns{display:flex;gap:6px}.btns button{flex:1}
.read{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px}
.big{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.k{font-size:12px;color:var(--mute)}
.v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
#spark{width:100%;height:56px;display:block;margin-top:4px}
.en{display:block;font-size:10px;line-height:1.2}
.note{font-size:12px;color:var(--mute);margin:6px 0 0;line-height:1.35}
@media (max-width:900px){main{grid-template-columns:1fr}}
@media (max-width:480px){.big{font-size:34px}header{padding-top:8px}}
</style>
</head>
<body>
<header>
<a href="https://github.com/Simon99/Semiconductor_Manufacturing_Introduction/blob/anim/ch22-pilot/zh-TW/0-before-you-start/01-how-a-fab-works/README.md">&larr; 回到章節</a>
<h1>晶圓（Wafer）廠（Fab）剖面圖：為什麼空氣只往一個方向流</h1>
</header>
<main>
<section class="card" id="stage" aria-label="晶圓廠（Fab）剖面模擬">
<canvas id="cv" width="960" height="600" role="img" aria-label="晶圓廠（Fab）剖面動畫：上層是空調與濾網（Filter），中層是無塵室（Cleanroom），下層是管線與附屬設備。橘色圓點是往下移動的微粒（Particle）。"></canvas>
</section>
<aside class="card panel">
<h2>逐步導覽</h2>
<div class="steps" role="group" aria-label="階段">
<button data-s="1" aria-pressed="false">1 進氣</button>
<button data-s="2" aria-pressed="false">2 過濾</button>
<button data-s="3" aria-pressed="false">3 無塵室<span class="en">（Cleanroom）</span></button>
<button data-s="4" aria-pressed="false">4 地板</button>
</div>
<p id="stext"></p>
<h2 style="margin-top:6px">動手試試</h2>
<button id="sw" role="switch" aria-checked="true"><span>天花板濾網（Ceiling filters）：<span id="swv">開</span></span><span class="knob"></span></button>
<div class="row"><label for="eff">濾網效率（Filter efficiency）</label><output id="effo"></output></div>
<input id="eff" type="range" min="0" max="99.99" step="0.01" value="99.97">
<div class="row"><label for="ppl">室內人數</label><output id="pplo"></output></div>
<input id="ppl" type="range" min="0" max="5" step="1" value="2">
<div class="btns" style="margin-top:8px"><button id="pause">暫停</button><button id="reset">重置</button></div>
<div class="read" aria-live="off">
<div style="grid-column:1/3"><div class="k">無塵室（Cleanroom）內目前的微粒（Particle）數</div><div class="big" id="now">0</div></div>
<div><div class="k">最近 10 秒平均</div><div class="v" id="avg">0</div></div>
<div><div class="k">最近 10 秒最高</div><div class="v" id="peak">0</div></div>
</div>
<canvas id="spark" width="320" height="56" aria-label="最近 40 秒的微粒（Particle）數量"></canvas>
<p class="note">示意：圓點代表微粒；數量並非實測的潔淨度等級（Cleanliness class）。</p>
</aside>
</main>

3:"3 無塵室（Cleanroom）。潔淨空氣往下流過各台機台（Tools）。人還是會掉皮屑和頭髮，但向下的氣流會持續把這些微粒（Particle）帶離晶圓（Wafer）。",
