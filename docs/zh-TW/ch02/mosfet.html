<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOSFET 開關互動圖</title>
<style>
:root{--bg:#f7f9fc;--tx:#1b2733;--tx2:#4a5b6c;--sub:#f3dccf;--np:#bcd4f2;--fox:#e3e6ec;--ox:#7fb2e5;--gate:#8e99a8;--metal:#d9a520;--chan:#2f6fe0;--el:#1646b8;--gbg:#dbe2ea;--gf:#e0892b;--boff:#d5dae1;--bon:#1f8a4c;--plus:#b3261e;--line:#556677;--pg:#eef2f7;--card:#fff;--bd:#cfd8e2;--ac:#2f6fe0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b24;--tx:#e8eef5;--tx2:#a9b8c8;--sub:#4a3a36;--np:#2a4a7a;--fox:#2b3340;--ox:#3f78b8;--gate:#7b8696;--metal:#c99a1c;--chan:#5b9bff;--el:#9cc2ff;--gbg:#2c3644;--gf:#f0a04b;--boff:#3a4452;--bon:#2fae68;--plus:#ff7b72;--line:#9fb0c2;--pg:#0d1218;--card:#141b24;--bd:#2c3644;--ac:#5b9bff}}
:root[data-theme="dark"]{--bg:#141b24;--tx:#e8eef5;--tx2:#a9b8c8;--sub:#4a3a36;--np:#2a4a7a;--fox:#2b3340;--ox:#3f78b8;--gate:#7b8696;--metal:#c99a1c;--chan:#5b9bff;--el:#9cc2ff;--gbg:#2c3644;--gf:#f0a04b;--boff:#3a4452;--bon:#2fae68;--plus:#ff7b72;--line:#9fb0c2;--pg:#0d1218;--card:#141b24;--bd:#2c3644;--ac:#5b9bff}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--tx);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--ac)}
.wrap{max-width:1240px;margin:0 auto;padding:10px 16px 20px}
.back{font-size:14px;margin:0 0 4px}
h1{font-size:22px;margin:2px 0 8px}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.scene svg{display:block;width:100%;height:auto}
.scene{background:var(--bg)}

.fox{fill:var(--fox)}.sub{fill:var(--sub)}.nplus{fill:var(--np)}.oxide{fill:var(--ox)}.gate{fill:var(--gate)}.metal{fill:var(--metal)}
.chan{fill:var(--chan)}.el{fill:var(--el)}.elm{stroke:var(--bg);stroke-width:2;fill:none}
.wire{stroke:var(--metal);stroke-width:5}.lead{stroke:var(--line);stroke-width:1.5}
.t{font:14px "Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--tx)}.t.b{font-weight:700;font-size:15px}.t.s{fill:var(--tx2);font-size:13px}
.t.gl{font-weight:700;font-size:16px;fill:#fff}.t.bw{font-weight:700;font-size:15px;fill:#fff}
.plus{font:700 18px "Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;fill:var(--plus)}
.gbg{fill:var(--gbg)}.gfill{fill:var(--gf)}.vt{stroke:var(--tx);stroke-width:2;stroke-dasharray:3 3}
.boff{fill:var(--boff)}.bon{fill:var(--bon)}

.panel h2{font-size:15px;margin:0 0 6px}
label{font-weight:600;font-size:15px}
input[type=range]{width:100%;accent-color:var(--ac);margin:6px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
button{font:inherit;font-size:13px;padding:4px 8px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button:hover,button.on{border-color:var(--ac);color:var(--ac)}
.ro{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;margin:8px 0}
.ro b{text-align:right;font-variant-numeric:tabular-nums}
#stage{font-size:14px;background:var(--pg);border-radius:8px;padding:8px 10px;min-height:72px;margin:8px 0}
#plot{width:100%;max-width:290px;height:auto;display:block}#plot .t{font-size:11px}
.note{font-size:12.5px;color:var(--tx2);margin:6px 0 0}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<p class="back"><a href="https://github.com/Simon99/Semiconductor_Manufacturing_Introduction/blob/anim/ch22-pilot/zh-TW/1-fundamentals/02-transistor-basics/README.md">&larr; 回到章節</a></p>
<h1>MOSFET：由閘極電壓（Gate voltage）控制的開關</h1>
<div class="grid">
<div class="card scene"><svg id="sc" viewBox="0 0 960 520" role="img" aria-label="MOSFET 剖面圖（Cross-section），標示源極（Source）、汲極（Drain）、閘極（Gate）、閘極氧化層（Gate oxide）與通道（Channel）">
<rect id="gaugebg" class="gbg" x="60" y="68" width="300" height="14" rx="7"/>
<rect id="gfill" class="gfill" x="60" y="68" width="300" height="14" rx="7"/>
<line class="vt" x1="210" y1="62" x2="210" y2="88"/>
<text class="t b" x="60" y="58">閘極電壓 Vg（Gate voltage）</text>
<text class="t s" x="210" y="106" text-anchor="middle">Vt（示意）</text>
<text class="t s" x="60" y="106">0 V</text>
<g id="stoff"><rect class="boff" x="520" y="52" width="380" height="42" rx="8"/><text class="t b" x="710" y="79" text-anchor="middle">關閉：開關斷路，無電流</text></g>
<g id="ston"><rect class="bon" x="520" y="52" width="380" height="42" rx="8"/><text class="t bw" x="710" y="79" text-anchor="middle">導通：開關閉合，電流流動</text></g>
<rect id="fox" class="fox" x="60" y="250" width="840" height="50"/>
<rect class="sub" x="60" y="300" width="840" height="170"/>
<path class="nplus" d="M120 300H330V360Q330 375 315 375H135Q120 375 120 360Z"/>
<path class="nplus" d="M630 300H840V360Q840 375 825 375H645Q630 375 630 360Z"/>
<rect class="oxide" x="330" y="285" width="300" height="15"/>
<rect class="gate" x="330" y="222" width="300" height="63" rx="3"/>
<rect class="metal" x="190" y="250" width="70" height="50"/><rect class="metal" x="700" y="250" width="70" height="50"/>
<line class="wire" x1="225" y1="250" x2="225" y2="150"/>
<line class="wire" x1="480" y1="222" x2="480" y2="150"/>
<line class="wire" x1="735" y1="250" x2="735" y2="150"/>
<text class="t b" x="225" y="132" text-anchor="middle">源極（Source, S）</text><text class="t s" x="225" y="147" text-anchor="middle" dy="-0">0 V 參考電位</text>
<text class="t b" x="480" y="132" text-anchor="middle">閘極（Gate, G）</text><text class="t s" x="480" y="147" text-anchor="middle">電壓 Vg</text>
<text class="t b" x="735" y="132" text-anchor="middle">汲極（Drain, D）</text><text class="t s" x="735" y="147" text-anchor="middle">正電壓</text>
<text class="t gl" x="480" y="258" text-anchor="middle">閘極</text>
<g id="plus"><text class="plus" x="365" y="279" text-anchor="middle">+</text><text class="plus" x="410" y="279" text-anchor="middle">+</text><text class="plus" x="455" y="279" text-anchor="middle">+</text><text class="plus" x="500" y="279" text-anchor="middle">+</text><text class="plus" x="545" y="279" text-anchor="middle">+</text><text class="plus" x="590" y="279" text-anchor="middle">+</text></g>
<text class="t s" x="225" y="345" text-anchor="middle">N+ 源極（N+ source）</text><text class="t s" x="735" y="345" text-anchor="middle">N+ 汲極（N+ drain）</text>
<text class="t s" x="480" y="458" text-anchor="middle" >P 型矽（P-type silicon, body）</text>
<rect id="chan" class="chan" x="330" y="300" width="300" height="16"/>
<line class="lead" x1="650" y1="232" x2="632" y2="292"/><text class="t b" x="500" y="196">閘極氧化層（Gate oxide）</text><text class="t s" x="500" y="212">極薄絕緣層（Thin insulator）</text>
<line class="lead" x1="480" y1="395" x2="480" y2="318"/><text class="t b" x="480" y="412" text-anchor="middle">通道（Channel）</text><text class="t s" x="480" y="428" text-anchor="middle">形成於閘極下方</text>
<g id="elgrp">
</g>
<text class="t s" x="480" y="500" text-anchor="middle">NMOS 剖面圖（Cross-section），已簡化，未依比例。Vt 與電壓皆為示意。</text>
</svg></div>
<div class="card panel">
<h2>試試看：調整閘極電壓</h2>
<label for="vg">閘極電壓 Vg（Gate voltage）：<span id="vgv">0.00</span> V</label>
<input id="vg" type="range" min="0" max="1.2" step="0.01" value="0">
<div class="row">
<button id="play" type="button">暫停</button>
<button id="auto" type="button">自動循環</button>
<button id="theme" type="button">主題</button>
</div>
<div class="row" id="stages">
<button data-v="0" type="button">1 關閉</button>
<button data-v="0.3" type="button">2 閘極充電</button>
<button data-v="0.55" type="button">3 通道形成</button>
<button data-v="0.95" type="button">4 電流流動</button>
</div>
<div class="ro"><span>臨界電壓 Vt（Threshold voltage）</span><b>0.50 V（示意）</b><span>狀態</span><b id="rs">關閉</b><span>通道（Channel）</span><b id="rc">無</b><span>汲極電流（Drain current）</span><b id="ri">約為 0</b></div>
<div id="stage"></div>
<svg id="plot" viewBox="0 0 300 150" role="img" aria-label="示意：汲極電流（Drain current）與閘極電壓（Gate voltage）的關係">
<line x1="36" y1="120" x2="290" y2="120" stroke="var(--line)"/><line x1="36" y1="120" x2="36" y2="10" stroke="var(--line)"/>
<path id="curve" fill="none" stroke="var(--ac)" stroke-width="2.5"/>
<line id="vtl" stroke="var(--tx2)" stroke-dasharray="3 3"/>
<circle id="dot" r="6" fill="var(--gf)" stroke="var(--tx)"/>
<text x="163" y="143" text-anchor="middle" class="t s">閘極電壓 Vg（Gate voltage, V）</text>
<text x="12" y="65" text-anchor="middle" class="t s" style="font-size:10px" transform="rotate(-90 12 65)">汲極電流（Drain current）</text>
<text id="vtt" class="t s" text-anchor="middle">Vt</text>
</svg>
<p class="note">理想化的示意：低於 Vt 時無電流，超過後電流隨 Vg &minus; Vt 增加，汲極電壓（Drain voltage）很小時。實際元件在低於 Vt 時仍會有少量漏電（Leakage）。</p>
</div>
</div>
</div>
<script>
(function(){
var Q=new URLSearchParams(location.search),VT=0.5,CYC=12000;
var th=Q.get('theme');if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);
var $=function(i){return document.getElementById(i)};
var NS='http://www.w3.org/2000/svg';
var st={t:0,manual:false,vg:0,paused:false};
var NE=8,els=[],grp=$('elgrp');
for(var i=0;i<NE;i++){var g=document.createElementNS(NS,'g');g.innerHTML='<circle class="el" cx="0" cy="0" r="7"/><path class="elm" d="M-4 0H4"/>';grp.appendChild(g);els.push(g);}
function lerp(a,b,x){return a+(b-a)*x}
function auto(t){var f=((t%CYC)+CYC)%CYC/CYC;
 if(f<.15)return 0;if(f<.35)return lerp(0,1,(f-.15)/.2);if(f<.8)return 1;if(f<.92)return lerp(1,0,(f-.8)/.12);return 0;}
function ss(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
function stageText(v){
 if(v<0.05)return '<b>1. 關閉。</b>閘極電壓（Gate voltage）為 0 V。N+ 源極（N+ source）與 N+ 汲極（N+ drain）之間隔著 P 型矽（P-type silicon），電流沒有通路，開關是斷開的。';
 if(v<VT)return '<b>2. 閘極充電。</b>正的閘極電壓（Gate voltage）把電洞（Holes）推離氧化層（Oxide），並開始把電子（Electrons）吸向氧化層。但還不夠：Vg 仍低於 Vt，所以沒有通道（Channel）。';
 if(v<VT+0.15)return '<b>3. 通道形成。</b>Vg 已超過 Vt。電子（Electrons）聚集在閘極氧化層（Gate oxide）下方的薄薄一層，把源極（Source）和汲極（Drain）接通。閘門打開了。';
 return '<b>4. 電流流動。</b>電子（Electrons）經由通道（Channel）從源極（Source）流向汲極（Drain）。Vg 越高，通道越強，電流也越大。';}
function render(){
 var v=st.manual?st.vg:auto(st.t);
 var on=v>=VT, od=Math.max(0,v-VT), I=od/0.7;
 $('gfill').setAttribute('style','transform-box:fill-box;transform-origin:left center;transform:scaleX('+Math.min(1,v/1.0)+')');
 $('plus').style.opacity=Math.min(1,v/0.6);
 var cs=ss(od/0.08);
 var h=on?(5+11*Math.min(1,od/0.5)):0;
 var ch=$('chan');ch.setAttribute('height',h);ch.style.opacity=cs;
 $('ston').style.opacity=cs;$('stoff').style.opacity=1-cs;
 var sp=0.12+0.5*Math.min(1,od/0.7);
 for(var i=0;i<NE;i++){var p=((st.t/1000*sp*1000*0.25+i*660/NE)%660);
  els[i].setAttribute('transform','translate('+(150+p)+' 308)');
  var e=p<50?p/50:(p>610?(660-p)/50:1);els[i].style.opacity=cs*Math.max(0,e);}
 $('vgv').textContent=v.toFixed(2);
 if(document.activeElement!==$('vg')||!st.manual)$('vg').value=v;
 $('rs').textContent=on?'導通':'關閉';
 $('rc').textContent=on?(od<0.15?'剛形成':'已形成'):'無';
 $('ri').textContent=on?(Math.round(I*100)+' 單位（示意）'):'約為 0';
 $('stage').innerHTML=stageText(v);
 // plot
 var X=function(x){return 36+x/1.2*254},Y=function(y){return 120-y/0.7*100};
 $('curve').setAttribute('d','M'+X(0)+' '+Y(0)+'L'+X(VT)+' '+Y(0)+'L'+X(1.2)+' '+Y(0.7));
 $('vtl').setAttribute('x1',X(VT));$('vtl').setAttribute('x2',X(VT));$('vtl').setAttribute('y1',120);$('vtl').setAttribute('y2',14);
 $('vtt').setAttribute('x',X(VT));$('vtt').setAttribute('y',11);$('vtt').textContent='Vt = 0.5 V';
 $('dot').setAttribute('cx',X(v));$('dot').setAttribute('cy',Y(od));
 $('play').textContent=st.paused?'播放':'暫停';
 $('auto').className=st.manual?'':'on';
}
var last=null;
function tick(ts){if(last!==null&&!st.paused&&!st.still){var d=ts-last;st.t+=d;if(st.manual)st.t+=0;}last=ts;render();requestAnimationFrame(tick);}
window.__setTime=function(ms){st.t=ms;st.manual=false;st.paused=true;render();};
$('vg').addEventListener('input',function(e){st.manual=true;st.vg=parseFloat(e.target.value);render();});
$('play').onclick=function(){st.paused=!st.paused;render();};
$('auto').onclick=function(){st.manual=false;st.paused=false;render();};
$('theme').onclick=function(){var r=document.documentElement,c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',c==='dark'?'light':'dark');};
Array.prototype.forEach.call(document.querySelectorAll('#stages button'),function(b){b.onclick=function(){st.manual=true;st.vg=parseFloat(b.dataset.v);render();};});
if(Q.get('vg')!==null){st.manual=true;st.vg=parseFloat(Q.get('vg'));}
if(Q.get('t')!==null){st.t=parseFloat(Q.get('t'));}
else if(!Q.get('still')){st.t=6000;}
if(Q.get('t')!==null||Q.get('still')==='1'){st.paused=true;st.still=true;}
render();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
