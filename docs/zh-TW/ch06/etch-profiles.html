<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蝕刻輪廓：等向與非等向</title>
<style>
:root{--bg:#f1f3f8;--card:#fff;--ink:#1b2433;--mute:#44506a;--line:#c9ced8;--resist:#e2735a;--film:#6f9bd1;--stop:#8b909a;--red:#c0182b;--green:#2a7f62;--accent:#2457c5;--cav:#fff}
:root[data-theme=dark]{--bg:#12151c;--card:#1b2030;--ink:#e8ecf5;--mute:#a7b2c9;--line:#38405a;--resist:#e2735a;--film:#4f79b0;--stop:#6a707c;--red:#ff6b7d;--green:#4fcf9f;--accent:#7aa2ff;--cav:#1b2030}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151c;--card:#1b2030;--ink:#e8ecf5;--mute:#a7b2c9;--line:#38405a;--film:#4f79b0;--stop:#6a707c;--red:#ff6b7d;--green:#4fcf9f;--accent:#7aa2ff;--cav:#1b2030}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 24px}
a{color:var(--accent)}
h1{font-size:24px;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 12px}
.grid{align-items:start;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
svg{display:block;width:100%;height:auto}
.t{fill:var(--ink)} .m{fill:var(--mute)}
.cav{fill:var(--cav);stroke:var(--ink);stroke-width:1.6}
label{display:block;font-weight:600;margin:6px 0 2px}
input[type=range]{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;margin-top:8px}
td{padding:4px 0;border-top:1px solid var(--line)} td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.story{min-height:5.6em;margin:8px 0 0}
.note{color:var(--mute);font-size:14px;margin-top:8px}
.tag{display:inline-block;font-weight:700;color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
<div><a href="https://github.com/Simon99/Semiconductor_Manufacturing_Introduction/blob/anim/ch22-pilot/zh-TW/2-process-modules/06-etching/README.md">&larr; 回到章節</a></div>
<h1>等向與非等向蝕刻</h1>
<p class="sub">拖曳非等向性滑桿，觀察側壁與光阻下方的側蝕如何變化。</p>
<div class="grid">
<div class="card">
<svg id="sc" viewBox="0 0 640 400" role="img" aria-label="光阻開口下薄膜被蝕刻的剖面圖">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--green)"/></marker></defs>
<rect x="20" y="130" width="600" height="140" fill="var(--film)"/>
<rect x="20" y="270" width="600" height="50" fill="var(--stop)"/>
<text x="30" y="300" font-size="14" fill="#fff">下層（蝕刻停止層）</text>
<path id="g0" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".8"/>
<path id="g1" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".8"/>
<path id="cav" class="cav"/>
<rect x="20" y="90" width="220" height="40" fill="var(--resist)"/>
<rect x="400" y="90" width="220" height="40" fill="var(--resist)"/>
<text x="30" y="116" font-size="14" font-weight="600" fill="#fff">光阻</text>
<g id="arr"></g>
<g stroke="var(--mute)" stroke-width="1.5"><line x1="240" y1="82" x2="400" y2="82"/><line x1="240" y1="77" x2="240" y2="87"/><line x1="400" y1="77" x2="400" y2="87"/></g>
<text x="320" y="72" text-anchor="middle" font-size="13" class="m">光阻開口</text>
<g id="dim" stroke="var(--red)" stroke-width="3"><line id="dl" y1="146" y2="146"/><line id="dt" y1="139" y2="153"/></g>
<text id="dtxt" y="172" text-anchor="end" font-size="15" font-weight="700" fill="var(--red)" stroke="var(--cav)" stroke-width="4" paint-order="stroke">側蝕</text>
<text x="620" y="345" text-anchor="end" font-size="13" class="m">虛線：相同蝕刻時間下的等向（0）與完全非等向（1）</text>
<text id="sw" x="320" y="380" text-anchor="middle" font-size="16" font-weight="700" class="t"></text>
</svg>
</div>
<div class="card">
<label for="a">非等向性：<span id="av">1.00</span> <span class="m" style="font-weight:400">（0＝各方向速度相同，1＝只往正下方）</span></label>
<input id="a" type="range" min="0" max="1" step="0.01" value="1">
<label for="tt">蝕刻進度：<span id="tv"></span></label>
<input id="tt" type="range" min="0" max="1.1" step="0.005" value="0">
<div class="row"><button id="play">暫停</button><button id="reset">重新開始</button></div>
<div class="row" id="stages">
<button data-t="0">1 光罩圖形</button><button data-t="0.5">2 蝕刻中</button><button data-t="1">3 到達下層</button><button data-t="1.1">4 過度蝕刻</button>
</div>
<p class="story" id="story"></p>
<table>
<tr><td>縱向：橫向蝕刻速率</td><td id="r"></td></tr>
<tr><td>深度（×薄膜厚度）</td><td id="d"></td></tr>
<tr><td>單側側蝕（×薄膜厚度）</td><td id="u"></td></tr>
<tr><td>孔洞比光阻開口寬出</td><td id="w"></td></tr>
<tr><td>典型對應</td><td id="k"></td></tr>
</table>
<p class="note">示意用的幾何模型：橫向速率＝（1 &minus; 非等向性）&times; 縱向速率。實際輪廓還取決於化學成分、離子、壓力與側壁鈍化。乾蝕刻不一定都是非等向，有些乾蝕刻會刻意調成等向。</p>
</div>
</div>
</div>
<script>
(function(){
var T=140,YF=130,W=160,CX=320,N=26,TEND=1.1,LOOP=9000;
var q=new URLSearchParams(location.search);
var th=q.get('theme'); if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);
var $=function(i){return document.getElementById(i)};
var a=q.get('a')!==null?Math.min(1,Math.max(0,parseFloat(q.get('a')))):1;
var t=0,playing=true,last=null,lastA=null;
function cav(a,t){
 var L=(1-a)*t*T,ry=t*T,x0=CX-W/2,x1=CX+W/2,p=[],i,g;
 for(i=0;i<=N;i++){g=Math.PI/2*i/N;p.push([x0-L*Math.cos(g),YF+Math.min(ry*Math.sin(g),T)])}
 for(i=N;i>=0;i--){g=Math.PI/2*i/N;p.push([x1+L*Math.cos(g),YF+Math.min(ry*Math.sin(g),T)])}
 return 'M'+p.map(function(s){return s[0].toFixed(1)+' '+s[1].toFixed(1)}).join(' L')+'Z';
}
function arrows(a){
 var s='',i,dx;
 var iso=[-60,-30,0,30,60];
 for(i=0;i<5;i++){dx=iso[i];s+='<line x1="'+(CX+dx*.2)+'" y1="10" x2="'+(CX+dx*1.1)+'" y2="52" stroke="var(--green)" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="6 5" opacity="'+(1-a).toFixed(2)+'"><animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" repeatCount="indefinite"/></line>';}
 [-48,-16,16,48].forEach(function(d){s+='<line x1="'+(CX+d)+'" y1="10" x2="'+(CX+d)+'" y2="52" stroke="var(--green)" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="6 5" opacity="'+a.toFixed(2)+'"><animate attributeName="stroke-dashoffset" values="0;-22" dur=".7s" repeatCount="indefinite"/></line>';});
 s+='<text x="480" y="30" font-size="13" font-weight="600" fill="var(--green)" opacity="'+a.toFixed(2)+'">離子，筆直向下</text>';
 s+='<text x="480" y="48" font-size="13" font-weight="600" fill="var(--green)" opacity="'+(1-a).toFixed(2)+'">蝕刻劑，往各方向</text>';
 return s;
}
function kind(a){return a<0.15?'濕蝕刻（化學性、等向）':a<0.6?'化學成分偏重的電漿蝕刻':a<0.9?'以離子為主的電漿蝕刻':'理想的離子驅動電漿蝕刻';}
function sidewall(a){return a<0.15?'側壁圓弧，側蝕嚴重':a<0.6?'側壁外凸，明顯側蝕':a<0.9?'幾乎筆直，輕微側蝕':'側壁筆直、垂直';}
function stage(t){return t<0.02?0:t<0.98?1:t<1.0?2:t<1.06?2:3}
var STORY=[
 '1. 光罩圖形。微影完成後，圖形只存在於光阻上。光阻蓋住的薄膜受到保護。',
 '2. 蝕刻中。開口下方的薄膜被去除。非等向性低時，蝕刻也會往光阻下方橫向蔓延；非等向性高時則只往下。',
 '3. 到達下層。此時電漿發光會改變（終點偵測）。孔洞深度已等於薄膜厚度。',
 '4. 過度蝕刻。再多蝕刻一點，確保薄膜處處清乾淨。若有橫向蝕刻，會持續擴大，側蝕也就越來越大。'];
function render(){
 var L=(1-a)*t*T;
 $('cav').setAttribute('d',cav(a,t));
 $('g0').setAttribute('d',cav(0,t));$('g1').setAttribute('d',cav(1,t));
 var x0=CX-W/2;
 $('dl').setAttribute('x1',(x0-L).toFixed(1));$('dl').setAttribute('x2',x0);
 $('dt').setAttribute('x1',x0);$('dt').setAttribute('x2',x0);
 $('dtxt').setAttribute('x',x0-10);$('dim').style.display=L<2?'none':'';
 $('dtxt').textContent=L<2?'側蝕 ≈ 0':'側蝕';
 $('av').textContent=a.toFixed(2);
 $('tv').textContent=(t/TEND*100).toFixed(0)+'% 預定時間（'+(t<=1?'蝕刻中':'過度蝕刻')+'）';
 $('tt').value=t;$('a').value=a;
 $('r').textContent='1 : '+(1-a).toFixed(2);
 $('d').textContent=Math.min(t,1).toFixed(2);
 $('u').textContent=(L/T).toFixed(2);
 $('w').textContent=(2*L/T).toFixed(2)+' ×薄膜厚度';
 $('k').textContent=kind(a);
 $('sw').textContent=sidewall(a);
 if(lastA!==a){$('arr').innerHTML=arrows(a);lastA=a}
 var s=stage(t);$('story').textContent=STORY[s];
 Array.prototype.forEach.call($('stages').children,function(b,i){b.className=i===s?'on':''});
 $('play').textContent=playing?'暫停':'播放';
}
function frame(ts){
 if(playing){if(last!==null){t+= (ts-last)/LOOP*TEND; if(t>TEND+0.15)t=0; if(t>TEND&&t<TEND+0.15){/* hold */}}
  last=ts;render_t();}
 else last=null;
 requestAnimationFrame(frame);
}
function render_t(){var tt=Math.min(t,TEND);var s=t;t=tt;render();t=s;}
$('a').addEventListener('input',function(e){a=parseFloat(e.target.value);render()});
$('tt').addEventListener('input',function(e){playing=false;t=parseFloat(e.target.value);render()});
$('play').addEventListener('click',function(){playing=!playing;if(playing&&t>=TEND)t=0;render()});
$('reset').addEventListener('click',function(){t=0;playing=true;render()});
Array.prototype.forEach.call($('stages').children,function(b){b.addEventListener('click',function(){playing=false;t=parseFloat(b.getAttribute('data-t'));render()})});
window.__setTime=function(ms){playing=false;t=Math.max(0,Math.min(TEND,ms/LOOP*TEND));render();};
if(q.get('still')==='1'){playing=false;t=TEND}
else if(q.get('t')!==null){playing=false;t=Math.max(0,Math.min(TEND,parseFloat(q.get('t'))/LOOP*TEND))}
render();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
