const th=q.get('theme'); if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);
let T=6,p=0,playing=true,tms=0;
const dot=$('dot'),trail=$('trail'),pos=$('pos');
function route(){return $('route-'+T)}
function tier(k){return k<=2?'下層':k<=4?'中層':'上層'}
function bandAt(y){for(const n of DATA.order){const b=DATA.bands[n];if(y>=b[0]&&y<=b[1])return n}return null}
function calc(){
  const v=DATA.var[T];let R=0,Rm2=0;
  for(const [k,len] of v.segs){const w=DATA.wt[k];R+=len/(w[0]*w[1])}
  const L2=DATA.var[2].segs[0][1];Rm2=L2/(DATA.wt[2][0]*DATA.wt[2][1]);
  $('r-via').textContent=v.vias+' 個（另加 2 個接觸窗）';
  $('r-R').textContent=(R*1000).toFixed(1)+' 單位';
  $('r-rel').textContent=(R/Rm2).toFixed(2)+'×';
}
function render(){
  for(const t of [2,3,4,5,6])$('pg-'+t).style.display=(t===T)?'block':'none';
  const r=route(),L=DATA.var[T].L,pt=r.getPointAtLength(p*L);
  dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);
  trail.setAttribute('d',r.getAttribute('d'));trail.setAttribute('stroke-dasharray',(p*L)+' '+(L*3));
  trail.style.display=p>0.002?'block':'none';
  const b=bandAt(pt.y);
  for(const n of DATA.order)$('glow-'+n).setAttribute('opacity',n===b?0.3:0);
  const name=b?DATA.bands[b][2]:'';
  $('nowtxt').textContent='訊號目前位於：'+name;$('r-now').textContent=b?(b==='C'?'接觸窗':b):'-';
  pos.value=Math.round(p*1000);
  $('Tout').textContent='M'+T;
}
function steps(){
  const v=DATA.var[T],e=v.entry;
  const S=[
   ['1. 接觸窗',0.0,'訊號從電晶體 A 出發，經過鎢接觸窗：在絕緣層（Insulator）上挖出小孔並填入金屬，一路通到第一層金屬（M1）。'],
   ['2. 下層',(e[2]+ (T>2?20:0))/v.L,'M1–M2 又窄又密，像巷弄。細導線的截面積小，所以只用在鄰近電晶體之間的短距離連接。'],
   ['3. 中層',T>=3?(e[3]+10)/v.L:null,'M3–M4 比較寬，像市區道路，連接不同的電路區塊。導通孔（Via）（層與層之間填滿金屬的孔）把訊號從一層送到下一層。'],
   ['4. 最長的一段',v.top/v.L,'長距離的一段走在 M'+T+'（'+tier(T)+'）。'+(T>=5?'粗而寬的導線截面積大，單位長度的電阻很低，所以長距離訊號和電源都走最上面幾層。':'試著把最高金屬層往上調：更寬、更厚的導線能降低長距離走線的電阻。')],
   ['5. 向下走回來',1.0,'訊號沿著導通孔（Via）一路往下，再經過另一個接觸窗，進入電晶體 B 的閘極。']
  ];
  const box=$('steps');box.innerHTML='';
  S.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent=s[0];b.disabled=s[1]===null;
    b.onclick=()=>{playing=false;$('play').textContent='播放';p=Math.min(1,Math.max(0,s[1]));$('sttitle').textContent=s[0];$('sttext').textContent=s[2];render()};box.appendChild(b)});
  window.__steps=S;
}
function setT(t){T=t;steps();calc();render()}
$('T').oninput=e=>{setT(+e.target.value)};
pos.oninput=e=>{playing=false;$('play').textContent='播放';p=e.target.value/1000;render()};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暫停':'播放'};
$('rst').onclick=()=>{p=0;tms=0;playing=true;$('play').textContent='暫停';render()};
let last=null;
function tick(ts){
  if(last!==null&&playing){tms=(tms+ts-last)%CYCLE;p=Math.min(1,tms/TRAVEL);render()}
  last=ts;requestAnimationFrame(tick);
}
window.__setTime=function(ms){playing=false;$('play').textContent='播放';tms=((ms%CYCLE)+CYCLE)%CYCLE;p=Math.min(1,tms/TRAVEL);render()};
window.__setT=setT;
const tq=q.get('T');if(tq)T=Math.max(2,Math.min(6,+tq));$('T').value=T;
steps();calc();$('sttitle').textContent='跟著訊號走';$('sttext').textContent='按下「播放」、拖曳位置滑桿，或選一個步驟。金色的導線和導通孔（Via），就是兩個電晶體之間的一條訊號路徑。';
render();
if(q.get('still')==='1'){playing=false;$('play').textContent='播放';p=0.5;render()}
if(q.get('t')!==null)window.__setTime(+q.get('t'));
if(q.get('step')){const i=+q.get('step')-1;document.querySelectorAll('#steps button')[i].click()}
requestAnimationFrame(tick);
})();
</script></body></html>
