<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ti de"><title id="ti">Photography versus lithography</title><desc id="de">Side by side: a darkroom print (lamp, film negative, lens, photo paper) and lithography (UV light source, mask, lens, photoresist on a wafer). Light passes through the negative or mask, the coating changes where light hits, and a developer reveals the picture or pattern.</desc><style>svg{--bg:#f6f7fb;--fg:#1b2233;--mut:#55607a;--line:#8a93a8;--warm:#e8a600;--uv:#b52fd6;--quartz:#cfe6f5;--chrome:#2b3345;--film:#e9c27a;--paper:#ffffff;--dark:#3a3f4d;--latent:#c9c4b8;--resist:#e4813f;--layer:#6fa8dc;--si:#8e97a8}
.bg{fill:var(--bg)}
.t{fill:var(--fg);font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tb{font-weight:700}
.tm{fill:var(--mut)}
.th{font-size:18px;font-weight:700}
.tc{font-size:14px;font-weight:700}
.ph{font-size:15px;font-weight:700}
.dv{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.warm{fill:var(--warm)} .uv{fill:var(--uv)}
.beamw{fill:var(--warm);fill-opacity:.22}
.beamu{fill:var(--uv);fill-opacity:.22}
.ph-w{fill:var(--warm)} .ph-u{fill:var(--uv)}
.bulbw{fill:var(--warm);stroke:var(--fg);stroke-width:1.5}
.bulbu{fill:var(--uv);stroke:var(--fg);stroke-width:1.5}
.base{fill:var(--line);stroke:var(--fg);stroke-width:1}
.fil{fill:none;stroke:var(--fg);stroke-width:1.6}
.film{fill:var(--film);stroke:var(--fg);stroke-width:1.2}
.opq{fill:var(--chrome);stroke:var(--fg);stroke-width:.6}
.quartz{fill:var(--quartz);stroke:var(--fg);stroke-width:1.2}
.lens{fill:var(--quartz);fill-opacity:.55;stroke:var(--fg);stroke-width:1.5}
.mir{fill:none;stroke:var(--fg);stroke-width:6;stroke-linecap:round}
.mirs{fill:none;stroke:var(--warm);stroke-width:2}
.paper{fill:var(--paper);stroke:var(--fg);stroke-width:1.2}
.pd{fill:var(--dark);animation:pdk 12s linear infinite}
.resist{fill:var(--resist)}
.gap{fill:var(--bg);animation:gp 12s linear infinite}
.layer{fill:var(--layer)} .si{fill:var(--si)}
.outl{fill:none;stroke:var(--fg);stroke-width:1.2}
.photon{opacity:0}
.beam{animation:bm 12s linear infinite}
.lb1{opacity:0;animation:l1 12s linear infinite}
.lb2{opacity:0;animation:l2 12s linear infinite}
.lb3{opacity:1;animation:l3 12s linear infinite}
@keyframes bm{0%{opacity:1}3%{opacity:.08}14%{opacity:.08}18%{opacity:1}50%{opacity:1}55%{opacity:.08}92%{opacity:.08}100%{opacity:1}}
@keyframes gp{0%,3%{fill:var(--bg)}5%,18%{fill:var(--resist)}24%,54%{fill:var(--uv)}78%,100%{fill:var(--bg)}}
@keyframes pdk{0%,3%{fill:var(--dark)}5%,24%{fill:var(--paper)}50%,54%{fill:var(--latent)}78%,100%{fill:var(--dark)}}
@keyframes l1{0%,3%{opacity:0}5%,13%{opacity:1}15%,100%{opacity:0}}
@keyframes l2{0%,15%{opacity:0}17%,50%{opacity:1}52%,100%{opacity:0}}
@keyframes l3{0%,3%{opacity:1}5%,52%{opacity:0}54%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes pa00{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(110px,172px);opacity:1}32%{transform:translate(110px,190px);opacity:1}92%{transform:translate(80px,378px);opacity:1}100%{transform:translate(80px,382px);opacity:0}}.pa00{animation:pa00 3s linear infinite;animation-delay:0s}@keyframes pa01{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(110px,172px);opacity:1}32%{transform:translate(110px,190px);opacity:1}92%{transform:translate(80px,378px);opacity:1}100%{transform:translate(80px,382px);opacity:0}}.pa01{animation:pa01 3s linear infinite;animation-delay:-1.5s}@keyframes pa10{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(134px,172px);opacity:1}32%{transform:translate(134px,190px);opacity:1}92%{transform:translate(128px,378px);opacity:1}100%{transform:translate(128px,382px);opacity:0}}.pa10{animation:pa10 3s linear infinite;animation-delay:0s}@keyframes pa11{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(134px,172px);opacity:1}32%{transform:translate(134px,190px);opacity:1}92%{transform:translate(128px,378px);opacity:1}100%{transform:translate(128px,382px);opacity:0}}.pa11{animation:pa11 3s linear infinite;animation-delay:-1.5s}@keyframes pa20{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(146px,172px);opacity:1}32%{transform:translate(146px,190px);opacity:1}92%{transform:translate(152px,378px);opacity:1}100%{transform:translate(152px,382px);opacity:0}}.pa20{animation:pa20 3s linear infinite;animation-delay:0s}@keyframes pa21{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(146px,172px);opacity:1}32%{transform:translate(146px,190px);opacity:1}92%{transform:translate(152px,378px);opacity:1}100%{transform:translate(152px,382px);opacity:0}}.pa21{animation:pa21 3s linear infinite;animation-delay:-1.5s}@keyframes pa30{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(170px,172px);opacity:1}32%{transform:translate(170px,190px);opacity:1}92%{transform:translate(200px,378px);opacity:1}100%{transform:translate(200px,382px);opacity:0}}.pa30{animation:pa30 3s linear infinite;animation-delay:0s}@keyframes pa31{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(170px,172px);opacity:1}32%{transform:translate(170px,190px);opacity:1}92%{transform:translate(200px,378px);opacity:1}100%{transform:translate(200px,382px);opacity:0}}.pa31{animation:pa31 3s linear infinite;animation-delay:-1.5s}@keyframes pb00{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(560px,172px);opacity:1}32%{transform:translate(560px,192px);opacity:1}58%{transform:translate(560px,262px);opacity:1}92%{transform:translate(605px,378px);opacity:1}100%{transform:translate(605px,382px);opacity:0}}.pb00{animation:pb00 3s linear infinite;animation-delay:0s}@keyframes pb01{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(560px,172px);opacity:1}32%{transform:translate(560px,192px);opacity:1}58%{transform:translate(560px,262px);opacity:1}92%{transform:translate(605px,378px);opacity:1}100%{transform:translate(605px,382px);opacity:0}}.pb01{animation:pb01 3s linear infinite;animation-delay:-1.5s}@keyframes pb10{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(632px,172px);opacity:1}32%{transform:translate(632px,192px);opacity:1}58%{transform:translate(632px,262px);opacity:1}92%{transform:translate(623px,378px);opacity:1}100%{transform:translate(623px,382px);opacity:0}}.pb10{animation:pb10 3s linear infinite;animation-delay:0s}@keyframes pb11{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(632px,172px);opacity:1}32%{transform:translate(632px,192px);opacity:1}58%{transform:translate(632px,262px);opacity:1}92%{transform:translate(623px,378px);opacity:1}100%{transform:translate(623px,382px);opacity:0}}.pb11{animation:pb11 3s linear infinite;animation-delay:-1.5s}@keyframes pb20{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(704px,172px);opacity:1}32%{transform:translate(704px,192px);opacity:1}58%{transform:translate(704px,262px);opacity:1}92%{transform:translate(641px,378px);opacity:1}100%{transform:translate(641px,382px);opacity:0}}.pb20{animation:pb20 3s linear infinite;animation-delay:0s}@keyframes pb21{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(704px,172px);opacity:1}32%{transform:translate(704px,192px);opacity:1}58%{transform:translate(704px,262px);opacity:1}92%{transform:translate(641px,378px);opacity:1}100%{transform:translate(641px,382px);opacity:0}}.pb21{animation:pb21 3s linear infinite;animation-delay:-1.5s}</style><rect class="bg" width="960" height="540"/><text class="t th" x="480" y="28" text-anchor="middle">Photography vs. lithography: same idea, nanometer precision</text><text class="t tc" x="240" y="60" text-anchor="middle">Photography (darkroom print)</text><text class="t tc" x="720" y="60" text-anchor="middle">Lithography (scanner)</text><line class="dv" x1="480" y1="72" x2="480" y2="448"/><g class="beam"><polygon class="beamw" points="134,120 146,120 176,173 104,173"/><polygon class="beamw" points="104,191 176,191 191,249 89,249"/><polygon class="beamw" points="89,275 191,275 212,380 68,380"/><polygon class="beamu" points="614,120 626,120 716,173 524,173"/><polygon class="beamu" points="524,191 716,191 716,249 524,249"/><polygon class="beamu" points="524,275 716,275 644,384 596,384"/><circle class="photon ph-w pa00" r="3.2"/><circle class="photon ph-w pa01" r="3.2"/><circle class="photon ph-w pa10" r="3.2"/><circle class="photon ph-w pa11" r="3.2"/><circle class="photon ph-w pa20" r="3.2"/><circle class="photon ph-w pa21" r="3.2"/><circle class="photon ph-w pa30" r="3.2"/><circle class="photon ph-w pa31" r="3.2"/><circle class="photon ph-u pb00" r="3.2"/><circle class="photon ph-u pb01" r="3.2"/><circle class="photon ph-u pb10" r="3.2"/><circle class="photon ph-u pb11" r="3.2"/><circle class="photon ph-u pb20" r="3.2"/><circle class="photon ph-u pb21" r="3.2"/></g><rect class="base" x="132" y="68" width="16" height="10" rx="2"/><circle class="bulbw" cx="140" cy="98" r="19"/><path class="fil" d="M133 106 L136.5 96 L140 106 L143.5 96 L147 106"/><rect class="film" x="104" y="173" width="72" height="14"/><rect class="opq" x="116" y="173" width="12" height="14"/><rect class="opq" x="152" y="173" width="12" height="14"/><rect class="outl" x="104" y="173" width="72" height="14"/><ellipse class="lens" cx="140" cy="262" rx="60" ry="13"/><rect class="paper" x="68" y="380" width="144" height="16"/><rect class="pd" x="68" y="380" width="24" height="16"/><rect class="pd" x="116" y="380" width="24" height="16"/><rect class="pd" x="140" y="380" width="24" height="16"/><rect class="pd" x="188" y="380" width="24" height="16"/><rect class="outl" x="68" y="380" width="144" height="16"/><text class="t tm" x="140" y="420" text-anchor="middle">side view, not to scale</text><text class="t tb" x="232" y="100">Light source</text><text class="t tm" x="232" y="116">Lamp, white light</text><text class="t tb" x="232" y="176">Film negative</text><text class="t tm" x="232" y="192">Carries the picture</text><text class="t tb" x="232" y="258">Lens</text><text class="t tm" x="232" y="274">Focuses and enlarges</text><text class="t tb" x="232" y="372">Photo paper</text><text class="t tm" x="232" y="388">Changes where light hits;</text><text class="t tm" x="232" y="404">developer reveals the</text><text class="t tm" x="232" y="420">picture</text><rect class="base" x="612" y="68" width="16" height="10" rx="2"/><circle class="bulbu" cx="620" cy="98" r="19"/><path class="fil" d="M613 106 L616.5 96 L620 106 L623.5 96 L627 106"/><rect class="quartz" x="524" y="173" width="192" height="14"/><rect class="opq" x="524" y="187" width="24" height="6"/><rect class="opq" x="572" y="187" width="24" height="6"/><rect class="opq" x="596" y="187" width="24" height="6"/><rect class="opq" x="644" y="187" width="24" height="6"/><rect class="opq" x="668" y="187" width="24" height="6"/><rect class="outl" x="524" y="173" width="192" height="14"/><ellipse class="lens" cx="620" cy="262" rx="96" ry="13"/><rect class="si" x="520" y="410" width="200" height="20"/><rect class="layer" x="520" y="396" width="200" height="14"/><rect class="resist" x="520" y="384" width="76" height="12"/><rect class="resist" x="644" y="384" width="76" height="12"/><rect class="resist" x="596" y="384" width="6" height="12"/><rect class="gap" x="602" y="384" width="6" height="12"/><rect class="resist" x="608" y="384" width="6" height="12"/><rect class="resist" x="614" y="384" width="6" height="12"/><rect class="gap" x="620" y="384" width="6" height="12"/><rect class="resist" x="626" y="384" width="6" height="12"/><rect class="resist" x="632" y="384" width="6" height="12"/><rect class="gap" x="638" y="384" width="6" height="12"/><rect class="outl" x="520" y="384" width="200" height="46"/><text class="t tm" x="620" y="448" text-anchor="middle">wafer cross-section, not to scale</text><text class="t tb" x="732" y="100">Light source</text><text class="t tm" x="732" y="116">UV: 193 nm (DUV) or</text><text class="t tm" x="732" y="132">13.5 nm (EUV)</text><text class="t tb" x="732" y="176">Mask (reticle)</text><text class="t tm" x="732" y="192">Quartz plate, circuit pattern</text><text class="t tb" x="732" y="246">Lens</text><text class="t tm" x="732" y="262">Shrinks image to 1/4 size</text><text class="t tm" x="732" y="278">(EUV: mirrors, in vacuum)</text><text class="t tb" x="732" y="372">Photoresist on wafer</text><text class="t tm" x="732" y="388">Exposed resist changes;</text><text class="t tm" x="732" y="404">developer dissolves part,</text><text class="t tm" x="732" y="420">leaving the pattern</text><text class="t ph lb1" x="240" y="470" text-anchor="middle">1 Ready: fresh photo paper</text><text class="t ph lb2" x="240" y="470" text-anchor="middle">2 Expose: light on</text><text class="t ph lb3" x="240" y="470" text-anchor="middle">3 Develop: picture appears</text><text class="t ph lb1" x="720" y="470" text-anchor="middle">1 Ready: resist coated on wafer</text><text class="t ph lb2" x="720" y="470" text-anchor="middle">2 Expose: light through the mask</text><text class="t ph lb3" x="720" y="470" text-anchor="middle">3 Develop: pattern appears</text><text class="t" x="480" y="500" text-anchor="middle">Where light hits, the coating changes chemically; a developer then washes part of it away.</text><text class="t tm" x="480" y="520" text-anchor="middle">Lithography must be accurate to the nanometer, and every layer must line up with the one before it. Sizes illustrative.</text></svg>