<text x="844" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Preston relation</text>
<text x="844" y="326" text-anchor="middle" font-size="22" font-weight="700" fill="#1c2433">RR = K<tspan font-size="14" dy="4">p</tspan><tspan dy="-4"> · P · V</tspan></text>
<text x="844" y="352" text-anchor="middle" font-size="12" fill="#1c2433">RR removal rate</text>
<text x="844" y="369" text-anchor="middle" font-size="12" fill="#1c2433">P pressure   V relative speed</text>
<text x="844" y="386" text-anchor="middle" font-size="12" fill="#1c2433">Kp pad/slurry constant</text>
<text x="844" y="410" text-anchor="middle" font-size="12" fill="#4a5568" font-style="italic">more P or V = faster polish</text>
<text x="844" y="424" text-anchor="middle" font-size="11" fill="#4a5568" font-style="italic" style="display:none"></text>
</g>
<text class="cap c0" x="30" y="498" font-size="18" font-weight="600" fill="#1c2433">1  Slurry drips onto the spinning pad</text><text class="cap c1" x="30" y="498" font-size="18" font-weight="600" fill="#1c2433">2  The head presses the wafer face down onto the pad</text><text class="cap c2" x="30" y="498" font-size="18" font-weight="600" fill="#1c2433">3  Chemistry softens the surface, abrasive wears it away: high spots go first</text><text class="cap c3" x="30" y="498" font-size="18" font-weight="600" fill="#1c2433">4  The conditioner scrapes the pad so it stays rough</text>
</svg>