<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">CMP tool: platen, pad, polishing head, slurry nozzle, conditioner</title>
<desc id="d">Side view of a chemical mechanical planarization tool. The head presses a wafer face down onto a rotating pad while slurry drips on and a conditioner scrapes the pad. Removal rate follows the Preston relation RR = Kp x P x V.</desc>
<style>
.padscroll{animation:ps 1.2s linear infinite}
.platscroll{animation:ps40 1.6s linear infinite}
.headscroll{animation:hs .7s linear infinite}
.drop{animation:dr 1.2s ease-in infinite;opacity:0}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}
.pa{animation:pa 2s ease-in-out infinite}
.cond{animation:cd 4s ease-in-out infinite alternate}
.bumps{animation:bp 12s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.spin1{animation:sp 6s linear infinite;transform-box:fill-box;transform-origin:center}
.spin2{animation:sp 3s linear infinite;transform-box:fill-box;transform-origin:center}
.cap{opacity:0;animation:cp 12s linear infinite}
.c0{opacity:1;animation-delay:0s}.c1{animation-delay:3s}.c2{animation-delay:6s}.c3{animation-delay:9s}
@keyframes ps{to{transform:translateX(-30px)}}
@keyframes ps40{to{transform:translateX(-40px)}}
@keyframes hs{to{transform:translateX(-14px)}}
@keyframes dr{0%{transform:translateY(-8px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(54px);opacity:0}}
@keyframes pa{50%{transform:translateY(7px)}}
@keyframes cd{from{transform:translateX(-18px)}to{transform:translateX(14px)}}
@keyframes bp{0%,8%{transform:scaleY(1)}80%,100%{transform:scaleY(.12)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes cp{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.c0{opacity:1}.drop{opacity:1}}
</style>
