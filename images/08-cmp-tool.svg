<text x="76" y="252" font-size="14" font-weight="700" fill="#1c2433" text-anchor="start">Wafer</text><text x="76" y="268" font-size="12" fill="#4a5568" text-anchor="start">(face down)</text>
<line x1="125" y1="256" x2="222" y2="277" stroke="#2d3748" stroke-width="1.2"/><circle cx="222" cy="277" r="2.5" fill="#2d3748"/>
