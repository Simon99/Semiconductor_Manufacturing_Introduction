<text x="76" y="150" font-size="14" font-weight="700" fill="#1c2433" text-anchor="start">Slurry nozzle</text><text x="76" y="166" font-size="12" fill="#4a5568" text-anchor="start">abrasive + chemicals</text>
<line x1="74" y1="147" x2="62" y2="125" stroke="#2d3748" stroke-width="1.2"/>
