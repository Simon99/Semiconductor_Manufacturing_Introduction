<text x="30" y="38" font-size="22" font-weight="700" fill="#1c2433">CMP tool: polishing the wafer flat</text>
<text x="30" y="60" font-size="13" fill="#4a5568">Side view (animated, not to scale)</text>
<g transform="translate(10,70)"><defs><clipPath id="padclip"><rect x="20" y="280" width="580" height="18"/></clipPath><clipPath id="platclip"><rect x="20" y="298" width="580" height="47"/></clipPath><clipPath id="spclip"><rect x="295" y="130" width="30" height="85"/></clipPath><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d64545"/></marker><marker id="ahk" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2d3748"/></marker></defs>
