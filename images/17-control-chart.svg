<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">Control chart with an out-of-control point and a run of shifted points</title>
<desc id="d">Measurements plotted in time order against a center line, control limits and wider specification limits. One point is above the upper control limit; later nine points in a row sit above the center line.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.lbl{font-size:13px;fill:#dbe7f5}.sm{font-size:12px;fill:#9fb3cc}.h{font-size:20px;font-weight:700;fill:#f1f6fc}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
.brk{animation:brk 6s ease-in-out infinite}
.scan{animation:scan 12s linear infinite}
.c1{animation:c1 12s infinite}.c2{animation:c2 12s infinite}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
@keyframes brk{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(690px)}}
@keyframes c1{0%,100%{opacity:1}30%,45%{opacity:.6}}
@keyframes c2{0%,100%{opacity:1}60%,75%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.ring,.brk,.scan,.c1,.c2{animation:none}.ring{opacity:0}.scan{display:none}}
</style>
