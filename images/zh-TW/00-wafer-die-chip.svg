<text class="cap" x="480.0" y="478" text-anchor="middle">2. 晶粒</text>
<text class="sub" x="480.0" y="498" text-anchor="middle">從晶圓上切下來的一小塊</text>
<text class="lab" x="480.0" y="199" text-anchor="middle">虛線：切割道（Scribe line）（下刀的路徑）</text>
<text class="lab" x="480.0" y="451" text-anchor="middle">黃色：焊墊（Bond pad）（對外的連接點）</text>
