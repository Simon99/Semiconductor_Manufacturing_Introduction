<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant-TW" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">晶圓（Wafer）、晶粒（Die）與晶片（Chip）</title>
<desc id="d">一片晶圓（Wafer）上有許多相同的晶粒（Die）。放大其中一顆晶粒，沿著切割道（Scribe line）把晶圓切開，再把晶粒封裝（Packaging）成晶片（Chip）。</desc>
<style>
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d2733}
.title{font-size:22px;font-weight:700}
.cap{font-size:17px;font-weight:700}
.sub{font-size:13px;fill:#44546a}
.lab{font-size:13px;fill:#2a3a50}
.arrow{font-size:13px;fill:#44546a;font-weight:600}
.waf{fill:#c9d3e0;stroke:#6b7c93;stroke-width:2}
.dies rect{fill:#8fa6c4}
.hl{fill:#f08a24;stroke:#b85d00;stroke-width:1.5}
.dieb{fill:#8fa6c4;stroke:#4d6585;stroke-width:2}
.scribe{fill:none;stroke:#b85d00;stroke-width:2;stroke-dasharray:7 5}
.nb{fill:#b9c8dc;stroke:#4d6585}
.blk{fill:#5d7fa8;stroke:#34506f;stroke-width:1}
.wire{fill:none;stroke:#dfe8f4;stroke-width:1.5}
.pad{fill:#e6b422;stroke:#8a6a00;stroke-width:.8}
.lead{fill:#9aa4b2;stroke:#5b6572;stroke-width:1}
.body{fill:#2b2f36;stroke:#12151a;stroke-width:2}
.bw{stroke:#e6b422;stroke-width:1.5}
.link{stroke:#b85d00;stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.ar{fill:none;stroke:#44546a;stroke-width:3}
.arh{fill:#44546a}
.ring{fill:none;stroke:#f08a24;stroke-width:4;opacity:0}
.saw{fill:#d8dde4;stroke:#566;stroke-width:2}
.cover{animation:cov 12s infinite}
.sawg{animation:sw 12s infinite}
.r1{animation:r1 12s infinite}.r2{animation:r2 12s infinite}.r3{animation:r3 12s infinite}
.pulse{animation:pu 12s infinite}
@keyframes r1{0%,2%{opacity:0}5%,25%{opacity:1}30%,100%{opacity:0}}
@keyframes r2{0%,30%{opacity:0}35%,55%{opacity:1}60%,100%{opacity:0}}
@keyframes r3{0%,60%{opacity:0}65%,92%{opacity:1}97%,100%{opacity:0}}
@keyframes pu{0%,100%{opacity:1}15%{opacity:.35}30%{opacity:1}45%{opacity:.35}60%{opacity:1}}
@keyframes sw{0%,33%{opacity:0;transform:translateX(-30px)}36%{opacity:1;transform:translateX(-30px)}54%{opacity:1;transform:translateX(200px)}58%,100%{opacity:0;transform:translateX(200px)}}
@keyframes cov{0%,60%{opacity:1}64%,76%{opacity:0}82%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cover,.sawg,.r1,.r2,.r3,.pulse{animation:none}.sawg,.ring{opacity:0}}
</style>
<rect width="960" height="540" fill="#eef2f7"/>
<text class="title" x="30" y="40">從晶圓（Wafer）到晶片（Chip）</text>
<text class="sub" x="30" y="62">一片晶圓上有許多相同的晶粒（Die）；每顆晶粒切下後再封裝（Packaging）。</text>
