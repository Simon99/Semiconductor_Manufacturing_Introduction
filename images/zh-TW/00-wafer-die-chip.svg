<text class="cap" x="805.0" y="478" text-anchor="middle">3. 封裝後的晶片</text>
<text class="sub" x="805.0" y="498" text-anchor="middle">晶粒＋金線（Bond wire）＋塑膠外殼</text>
<text class="sub" x="805.0" y="515" text-anchor="middle">＋接腳（Pin）</text>
<text class="lab" x="805.0" y="200" text-anchor="middle">接腳把訊號傳到電路板（Circuit board）</text>
