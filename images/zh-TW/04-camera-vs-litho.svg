<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant-TW" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ti de"><title id="ti">攝影（Photography）與微影（Lithography）的對照</title><desc id="de">並排比較：暗房沖印（燈泡、底片（Film negative）、鏡頭（Lens）、相紙（Photo paper））與微影（紫外光（UV）光源、光罩（Mask）、鏡頭、晶圓（Wafer）上的光阻（Photoresist））。光穿過底片或光罩，塗層在受光處產生變化，再由顯影液（Developer）顯出畫面或圖形。</desc><style>svg{--bg:#f6f7fb;--fg:#1b2233;--mut:#55607a;--line:#8a93a8;--warm:#e8a600;--uv:#b52fd6;--quartz:#cfe6f5;--chrome:#2b3345;--film:#e9c27a;--paper:#ffffff;--dark:#3a3f4d;--latent:#c9c4b8;--resist:#e4813f;--layer:#6fa8dc;--si:#8e97a8}
.bg{fill:var(--bg)}
.t{fill:var(--fg);font:13px "Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tb{font-weight:700}
.tm{fill:var(--mut)}
.th{font-size:18px;font-weight:700}
.tc{font-size:14px;font-weight:700}
.ph{font-size:15px;font-weight:700}
.dv{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.warm{fill:var(--warm)} .uv{fill:var(--uv)}
.beamw{fill:var(--warm);fill-opacity:.22}
.beamu{fill:var(--uv);fill-opacity:.22}
.ph-w{fill:var(--warm)} .ph-u{fill:var(--uv)}
.bulbw{fill:var(--warm);stroke:var(--fg);stroke-width:1.5}
.bulbu{fill:var(--uv);stroke:var(--fg);stroke-width:1.5}
.base{fill:var(--line);stroke:var(--fg);stroke-width:1}
.fil{fill:none;stroke:var(--fg);stroke-width:1.6}
.film{fill:var(--film);stroke:var(--fg);stroke-width:1.2}
.opq{fill:var(--chrome);stroke:var(--fg);stroke-width:.6}
.quartz{fill:var(--quartz);stroke:var(--fg);stroke-width:1.2}
.lens{fill:var(--quartz);fill-opacity:.55;stroke:var(--fg);stroke-width:1.5}
.mir{fill:none;stroke:var(--fg);stroke-width:6;stroke-linecap:round}
.mirs{fill:none;stroke:var(--warm);stroke-width:2}
.paper{fill:var(--paper);stroke:var(--fg);stroke-width:1.2}
.pd{fill:var(--dark);animation:pdk 12s linear infinite}
.resist{fill:var(--resist)}
.gap{fill:var(--bg);animation:gp 12s linear infinite}
.layer{fill:var(--layer)} .si{fill:var(--si)}
.outl{fill:none;stroke:var(--fg);stroke-width:1.2}
.photon{opacity:0}
.beam{animation:bm 12s linear infinite}
.lb1{opacity:0;animation:l1 12s linear infinite}
.lb2{opacity:0;animation:l2 12s linear infinite}
.lb3{opacity:1;animation:l3 12s linear infinite}
@keyframes bm{0%{opacity:1}3%{opacity:.08}14%{opacity:.08}18%{opacity:1}50%{opacity:1}55%{opacity:.08}92%{opacity:.08}100%{opacity:1}}
@keyframes gp{0%,3%{fill:var(--bg)}5%,18%{fill:var(--resist)}24%,54%{fill:var(--uv)}78%,100%{fill:var(--bg)}}
@keyframes pdk{0%,3%{fill:var(--dark)}5%,24%{fill:var(--paper)}50%,54%{fill:var(--latent)}78%,100%{fill:var(--dark)}}
@keyframes l1{0%,3%{opacity:0}5%,13%{opacity:1}15%,100%{opacity:0}}
@keyframes l2{0%,15%{opacity:0}17%,50%{opacity:1}52%,100%{opacity:0}}
@keyframes l3{0%,3%{opacity:1}5%,52%{opacity:0}54%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes pa00{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(110px,172px);opacity:1}32%{transform:translate(110px,190px);opacity:1}92%{transform:translate(80px,378px);opacity:1}100%{transform:translate(80px,382px);opacity:0}}.pa00{animation:pa00 3s linear infinite;animation-delay:0s}@keyframes pa01{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(110px,172px);opacity:1}32%{transform:translate(110px,190px);opacity:1}92%{transform:translate(80px,378px);opacity:1}100%{transform:translate(80px,382px);opacity:0}}.pa01{animation:pa01 3s linear infinite;animation-delay:-1.5s}@keyframes pa10{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(134px,172px);opacity:1}32%{transform:translate(134px,190px);opacity:1}92%{transform:translate(128px,378px);opacity:1}100%{transform:translate(128px,382px);opacity:0}}.pa10{animation:pa10 3s linear infinite;animation-delay:0s}@keyframes pa11{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(134px,172px);opacity:1}32%{transform:translate(134px,190px);opacity:1}92%{transform:translate(128px,378px);opacity:1}100%{transform:translate(128px,382px);opacity:0}}.pa11{animation:pa11 3s linear infinite;animation-delay:-1.5s}@keyframes pa20{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(146px,172px);opacity:1}32%{transform:translate(146px,190px);opacity:1}92%{transform:translate(152px,378px);opacity:1}100%{transform:translate(152px,382px);opacity:0}}.pa20{animation:pa20 3s linear infinite;animation-delay:0s}@keyframes pa21{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(146px,172px);opacity:1}32%{transform:translate(146px,190px);opacity:1}92%{transform:translate(152px,378px);opacity:1}100%{transform:translate(152px,382px);opacity:0}}.pa21{animation:pa21 3s linear infinite;animation-delay:-1.5s}@keyframes pa30{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(170px,172px);opacity:1}32%{transform:translate(170px,190px);opacity:1}92%{transform:translate(200px,378px);opacity:1}100%{transform:translate(200px,382px);opacity:0}}.pa30{animation:pa30 3s linear infinite;animation-delay:0s}@keyframes pa31{0%{transform:translate(140px,122px);opacity:0}5%{transform:translate(140px,126px);opacity:1}25%{transform:translate(170px,172px);opacity:1}32%{transform:translate(170px,190px);opacity:1}92%{transform:translate(200px,378px);opacity:1}100%{transform:translate(200px,382px);opacity:0}}.pa31{animation:pa31 3s linear infinite;animation-delay:-1.5s}@keyframes pb00{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(560px,172px);opacity:1}32%{transform:translate(560px,192px);opacity:1}58%{transform:translate(560px,262px);opacity:1}92%{transform:translate(605px,378px);opacity:1}100%{transform:translate(605px,382px);opacity:0}}.pb00{animation:pb00 3s linear infinite;animation-delay:0s}@keyframes pb01{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(560px,172px);opacity:1}32%{transform:translate(560px,192px);opacity:1}58%{transform:translate(560px,262px);opacity:1}92%{transform:translate(605px,378px);opacity:1}100%{transform:translate(605px,382px);opacity:0}}.pb01{animation:pb01 3s linear infinite;animation-delay:-1.5s}@keyframes pb10{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(632px,172px);opacity:1}32%{transform:translate(632px,192px);opacity:1}58%{transform:translate(632px,262px);opacity:1}92%{transform:translate(623px,378px);opacity:1}100%{transform:translate(623px,382px);opacity:0}}.pb10{animation:pb10 3s linear infinite;animation-delay:0s}@keyframes pb11{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(632px,172px);opacity:1}32%{transform:translate(632px,192px);opacity:1}58%{transform:translate(632px,262px);opacity:1}92%{transform:translate(623px,378px);opacity:1}100%{transform:translate(623px,382px);opacity:0}}.pb11{animation:pb11 3s linear infinite;animation-delay:-1.5s}@keyframes pb20{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(704px,172px);opacity:1}32%{transform:translate(704px,192px);opacity:1}58%{transform:translate(704px,262px);opacity:1}92%{transform:translate(641px,378px);opacity:1}100%{transform:translate(641px,382px);opacity:0}}.pb20{animation:pb20 3s linear infinite;animation-delay:0s}@keyframes pb21{0%{transform:translate(620px,122px);opacity:0}5%{transform:translate(620px,126px);opacity:1}25%{transform:translate(704px,172px);opacity:1}32%{transform:translate(704px,192px);opacity:1}58%{transform:translate(704px,262px);opacity:1}92%{transform:translate(641px,378px);opacity:1}100%{transform:translate(641px,382px);opacity:0}}.pb21{animation:pb21 3s linear infinite;animation-delay:-1.5s}</style><rect class="bg" width="960" height="540"/><text class="t th" x="480" y="28" text-anchor="middle">攝影（Photography）與微影（Lithography）：原理相同，精度達奈米（Nanometer）等級</text><text class="t tc" x="240" y="60" text-anchor="middle">攝影（暗房沖印）</text><text class="t tc" x="720" y="60" text-anchor="middle">微影（曝光機，Scanner）</text><line class="dv" x1="480" y1="72" x2="480" y2="448"/><g class="beam"><polygon class="beamw" points="134,120 146,120 176,173 104,173"/><polygon class="beamw" points="104,191 176,191 191,249 89,249"/><polygon class="beamw" points="89,275 191,275 212,380 68,380"/><polygon class="beamu" points="614,120 626,120 716,173 524,173"/><polygon class="beamu" points="524,191 716,191 716,249 524,249"/><polygon class="beamu" points="524,275 716,275 644,384 596,384"/><circle class="photon ph-w pa00" r="3.2"/><circle class="photon ph-w pa01" r="3.2"/><circle class="photon ph-w pa10" r="3.2"/><circle class="photon ph-w pa11" r="3.2"/><circle class="photon ph-w pa20" r="3.2"/><circle class="photon ph-w pa21" r="3.2"/><circle class="photon ph-w pa30" r="3.2"/><circle class="photon ph-w pa31" r="3.2"/><circle class="photon ph-u pb00" r="3.2"/><circle class="photon ph-u pb01" r="3.2"/><circle class="photon ph-u pb10" r="3.2"/><circle class="photon ph-u pb11" r="3.2"/><circle class="photon ph-u pb20" r="3.2"/><circle class="photon ph-u pb21" r="3.2"/></g><rect class="base" x="132" y="68" width="16" height="10" rx="2"/><circle class="bulbw" cx="140" cy="98" r="19"/><path class="fil" d="M133 106 L136.5 96 L140 106 L143.5 96 L147 106"/><rect class="film" x="104" y="173" width="72" height="14"/><rect class="opq" x="116" y="173" width="12" height="14"/><rect class="opq" x="152" y="173" width="12" height="14"/><rect class="outl" x="104" y="173" width="72" height="14"/><ellipse class="lens" cx="140" cy="262" rx="60" ry="13"/><rect class="paper" x="68" y="380" width="144" height="16"/><rect class="pd" x="68" y="380" width="24" height="16"/><rect class="pd" x="116" y="380" width="24" height="16"/><rect class="pd" x="140" y="380" width="24" height="16"/><rect class="pd" x="188" y="380" width="24" height="16"/><rect class="outl" x="68" y="380" width="144" height="16"/><text class="t tm" x="140" y="420" text-anchor="middle">側視圖，未依比例</text><text class="t tb" x="232" y="100">光源（Light source）</text><text class="t tm" x="232" y="116">燈泡，白光</text><text class="t tb" x="232" y="176">底片（Film negative）</text><text class="t tm" x="232" y="192">承載畫面</text><text class="t tb" x="232" y="258">鏡頭（Lens）</text><text class="t tm" x="232" y="274">對焦並放大</text><text class="t tb" x="232" y="372">相紙（Photo paper）</text><text class="t tm" x="232" y="388">照到光的地方會變化；</text><text class="t tm" x="232" y="404">顯影（Development）液（Developer）讓畫面</text><text class="t tm" x="232" y="420">浮現出來</text><rect class="base" x="612" y="68" width="16" height="10" rx="2"/><circle class="bulbu" cx="620" cy="98" r="19"/><path class="fil" d="M613 106 L616.5 96 L620 106 L623.5 96 L627 106"/><rect class="quartz" x="524" y="173" width="192" height="14"/><rect class="opq" x="524" y="187" width="24" height="6"/><rect class="opq" x="572" y="187" width="24" height="6"/><rect class="opq" x="596" y="187" width="24" height="6"/><rect class="opq" x="644" y="187" width="24" height="6"/><rect class="opq" x="668" y="187" width="24" height="6"/><rect class="outl" x="524" y="173" width="192" height="14"/><ellipse class="lens" cx="620" cy="262" rx="96" ry="13"/><rect class="si" x="520" y="410" width="200" height="20"/><rect class="layer" x="520" y="396" width="200" height="14"/><rect class="resist" x="520" y="384" width="76" height="12"/><rect class="resist" x="644" y="384" width="76" height="12"/><rect class="resist" x="596" y="384" width="6" height="12"/><rect class="gap" x="602" y="384" width="6" height="12"/><rect class="resist" x="608" y="384" width="6" height="12"/><rect class="resist" x="614" y="384" width="6" height="12"/><rect class="gap" x="620" y="384" width="6" height="12"/><rect class="resist" x="626" y="384" width="6" height="12"/><rect class="resist" x="632" y="384" width="6" height="12"/><rect class="gap" x="638" y="384" width="6" height="12"/><rect class="outl" x="520" y="384" width="200" height="46"/><text class="t tm" x="620" y="448" text-anchor="middle">晶圓剖面，未依比例</text><text class="t tb" x="732" y="100">光源</text><text class="t tm" x="732" y="116">紫外光（UV）：193 nm（DUV）或</text><text class="t tm" x="732" y="132">13.5 nm（EUV）</text><text class="t tb" x="732" y="176">光罩（Mask, reticle）</text><text class="t tm" x="732" y="192">石英板（Quartz plate），</text><text class="t tm" x="732" y="208">帶有電路圖形</text><text class="t tb" x="732" y="246">鏡頭</text><text class="t tm" x="732" y="262">圖像縮小成 1/4 大小</text><text class="t tm" x="732" y="278">（EUV：反射鏡（Mirror），</text><text class="t tm" x="732" y="294">真空（Vacuum）中）</text><text class="t tb" x="732" y="372">晶圓（Wafer）上的光阻</text><text class="t tm" x="732" y="388">（Photoresist）</text><text class="t tm" x="732" y="404">受光的光阻會變化；</text><text class="t tm" x="732" y="420">顯影液溶掉一部分，</text><text class="t tm" x="732" y="436">留下圖形</text><text class="t ph lb1" x="240" y="470" text-anchor="middle">1 準備：全新相紙</text><text class="t ph lb2" x="240" y="470" text-anchor="middle">2 曝光（Exposure）：打光</text><text class="t ph lb3" x="240" y="470" text-anchor="middle">3 顯影（Development）：畫面浮現</text><text class="t ph lb1" x="720" y="470" text-anchor="middle">1 準備：晶圓已塗光阻</text><text class="t ph lb2" x="720" y="470" text-anchor="middle">2 曝光（Exposure）：光穿過光罩（Photomask）</text><text class="t ph lb3" x="720" y="470" text-anchor="middle">3 顯影：圖形浮現</text><text class="t" x="480" y="500" text-anchor="middle">光線照到的地方，塗層會起化學變化；顯影液再把一部分沖掉。</text><text class="t tm" x="480" y="520" text-anchor="middle">微影必須精準到奈米等級，且每一層都要與前一層對齊。尺寸為示意。</text></svg>