<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant-TW" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="tt dd">
<title id="tt">銅（Copper）CMP 的碟陷（Dishing）與侵蝕（Erosion）</title>
<desc id="dd">剖面動畫：隨著過度研磨（Over-polish）時間增加，較寬的銅導線（Copper line）中間逐漸凹陷（碟陷，Dishing），密集排列的銅導線整個區域則沉到周圍表面以下（侵蝕，Erosion）。</desc>
<style>
svg{--bg:#fbfaf7;--ink:#26282b;--mut:#5b6068;--di:#c9d3df;--cu:#d98a4a;--cu2:#9a5524;--hot:#d6322a;--panel:#eef0f3;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",sans-serif}
.t{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",sans-serif}
.static{display:none}
@media (prefers-reduced-motion:reduce){.anim{display:none}.static{display:inline}}
</style>
<rect width="960" height="600" fill="#fbfaf7"/>
<text class="t" x="40" y="36" font-size="22" font-weight="700" fill="#26282b">碟陷（Dishing）與侵蝕（Erosion）：過度研磨（Over-polish）造成的後果</text>
<text class="t" x="40" y="60" font-size="14" fill="#5b6068">CMP 後一層銅導線（Copper line）的剖面（示意圖，未依比例）</text>
<g style="--ink:#26282b">
<text class="t" x="270" y="128" font-size="17" font-weight="700" text-anchor="middle" fill="#d6322a">碟陷（Dishing）</text>
<text class="t" x="270" y="148" font-size="14" text-anchor="middle" fill="#26282b">單一條寬導線內部凹陷</text>
<text class="t" x="610" y="128" font-size="17" font-weight="700" text-anchor="middle" fill="#d6322a">侵蝕（Erosion）</text>
<text class="t" x="610" y="148" font-size="14" text-anchor="middle" fill="#26282b">整片密集區域變低</text>
<line x1="270" y1="156" x2="270" y2="190" stroke="#8a8f98" stroke-width="1"/>
<line x1="610" y1="156" x2="610" y2="190" stroke="#8a8f98" stroke-width="1"/>
<text class="t" x="926" y="196" font-size="12" text-anchor="end" fill="#26282b">原本的平坦高度</text>
</g>
