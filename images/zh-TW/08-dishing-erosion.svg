<text class="t" x="270" y="386" font-size="14" text-anchor="middle" fill="#26282b">寬導線<tspan x="270" dy="16" font-size="12">（Wide line）</tspan></text>
<text class="t" x="610" y="386" font-size="14" text-anchor="middle" fill="#26282b">密集窄導線<tspan x="610" dy="16" font-size="12">（Dense narrow lines）</tspan></text>
<text class="t" x="90" y="386" font-size="14" text-anchor="middle" fill="#26282b">稀疏區域<tspan x="90" dy="16" font-size="12">（Sparse area）</tspan></text>
<text class="t" x="60" y="345" font-size="13" fill="#3b4655">介電層（Dielectric，硬）</text>
<rect x="440" y="334" width="14" height="14" fill="#d98a4a" stroke="#9a5524"/><text class="t" x="460" y="346" font-size="13" fill="#26282b">銅（軟）</text>
<rect x="40" y="410" width="880" height="1" fill="#d5d8dd"/>
<text class="t" x="40" y="441" font-size="15" font-weight="700" fill="#26282b">過度研磨時間</text>
<rect x="260" y="428" width="340" height="14" rx="3" fill="#e1e4e8"/>
<g class="anim"><rect x="260" y="428" height="14" fill="var(--hot)" rx="3" width="289"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.1;0.2;0.3;0.8;0.9;1" values="289;289;0;0;340;340;289"/></rect></g><g class="static"><rect x="260" y="428" height="14" fill="#d6322a" rx="3" width="289"/></g>
<text class="t" x="260" y="462" font-size="12" fill="#5b6068">終點（Endpoint）</text>
<text class="t" x="600" y="462" font-size="12" text-anchor="end" fill="#5b6068">長時間過度研磨（示意）</text>
<g class="anim"><text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="0">到達終點：表面是平的（如虛線所示）。<animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.34;1" values="0;1;0;0"/></text>
<text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="0">繼續磨過終點（過度研磨）：軟的銅比硬的介電層磨得更快。<animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.34;0.6;1" values="0;1;0;0"/></text>
<text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="1">長時間過度研磨：寬導線中間凹陷（碟陷），密集區域比周圍低（侵蝕）。<animate attributeName="opacity" calcMode="discrete" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.6;1" values="1;0;1;1"/></text></g><g class="static"><text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="0">到達終點：表面是平的（如虛線所示）。</text>
<text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="0">繼續磨過終點（過度研磨）：軟的銅比硬的介電層磨得更快。</text>
<text class="t" x="40" y="486" font-size="15" fill="var(--ink)" opacity="1">長時間過度研磨：寬導線中間凹陷（碟陷），密集區域比周圍低（侵蝕）。</text></g>
<text class="t" x="40" y="526" font-size="14" fill="#26282b"><tspan font-weight="700">原因：</tspan>軟的金屬比硬的介電層磨得快，而且密集區域與稀疏區域的研磨情形不同。</text>
<text class="t" x="40" y="550" font-size="14" fill="#26282b"><tspan font-weight="700">結果：</tspan>導線變薄、電阻（Resistance）變高。虛擬填充（Dummy Fill）可讓圖形密度更平均，減輕這個問題。</text>
<text class="t" x="40" y="580" font-size="12" fill="#5b6068">圖中的深度僅為示意，不是實測數據。</text>
</svg>