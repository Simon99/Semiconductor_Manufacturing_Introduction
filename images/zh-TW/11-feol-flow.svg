<g class="c0"><text class="tx" x="40" y="503" font-size="16" font-weight="700">FEOL 成果：NMOS 與 PMOS 電晶體，等待接觸窗</text><text class="tx2" x="40" y="524" font-size="13.5">每個步驟都會在剖面上多加一層；動畫依序走完全部七個步驟（每輪約 16 秒）。</text></g><g class="c1"><text class="tx" x="40" y="503" font-size="16" font-weight="700">1  隔離（STI）</text><text class="tx2" x="40" y="524" font-size="13.5">在每個電晶體周圍蝕刻出淺溝槽，填入氧化矽，再用 CMP 磨平。</text></g><g class="c2"><text class="tx" x="40" y="503" font-size="16" font-weight="700">2  井</text><text class="tx2" x="40" y="524" font-size="13.5">以微影加佈植分別做出 P 井（NMOS）與 N 井（PMOS），再退火。</text></g><g class="c3"><text class="tx" x="40" y="503" font-size="16" font-weight="700">3  閘極</text><text class="tx2" x="40" y="524" font-size="13.5">長出極薄的閘極絕緣層，鋪上閘極材料，再定義出圖形。閘極長度至關重要。</text></g><g class="c4"><text class="tx" x="40" y="503" font-size="16" font-weight="700">4  淺摻雜</text><text class="tx2" x="40" y="524" font-size="13.5">在閘極兩側做一次淺而輕的佈植。</text></g><g class="c5"><text class="tx" x="40" y="503" font-size="16" font-weight="700">5  側壁間隔物</text><text class="tx2" x="40" y="524" font-size="13.5">鋪上一層薄膜，再全面往下蝕刻：只在閘極兩側側壁留下一小段。</text></g><g class="c6"><text class="tx" x="40" y="503" font-size="16" font-weight="700">6  源極與汲極</text><text class="tx2" x="40" y="524" font-size="13.5">做一次深而重的佈植，間隔物讓佈植與閘極保持一小段距離，再退火活化。</text></g><g class="c7"><text class="tx" x="40" y="503" font-size="16" font-weight="700">7  金屬矽化物</text><text class="tx2" x="40" y="524" font-size="13.5">鋪上金屬並加熱，使其與源極、汲極和閘極上的矽反應，形成低電阻的化合物。</text></g>
</svg>