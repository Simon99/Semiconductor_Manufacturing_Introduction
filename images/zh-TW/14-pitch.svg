<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant-TW" viewBox="0 0 960 552" width="960" height="552" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title>閘極間距與金屬間距（Gate pitch and metal pitch）</title>
<desc>從上方看的閘極（Gate）與金屬導線（Metal wire），標示 CPP 與 MMP；間距（Pitch）縮小到 0.7 倍後，同樣面積內可容納更多線條，相對密度（Relative density）提高到約 2 倍。</desc>
<style>
.sc{transform-origin:0 0;animation:shrink 12s linear infinite}
.lx{animation:lx 12s linear infinite}
.ly{animation:ly 12s linear infinite}
.bar{transform-box:fill-box;transform-origin:0 50%;animation:bar 12s linear infinite}
.oa{animation:oa 12s linear infinite}
.ob{animation:ob 12s linear infinite}
@keyframes shrink{0%,17%{transform:scale(1)}42%,75%{transform:scale(.7)}92%,100%{transform:scale(1)}}
@keyframes lx{0%,17%{transform:translateX(0)}42%,75%{transform:translateX(-34.8px)}92%,100%{transform:translateX(0)}}
@keyframes ly{0%,17%{transform:translateY(0)}42%,75%{transform:translateY(-24px)}92%,100%{transform:translateY(0)}}
@keyframes bar{0%,17%{transform:scaleX(1)}42%,75%{transform:scaleX(2.04)}92%,100%{transform:scaleX(1)}}
@keyframes oa{0%,41.9%{opacity:1}42%,91.9%{opacity:0}92%,100%{opacity:1}}
@keyframes ob{0%,41.9%{opacity:0}42%,91.9%{opacity:1}92%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.t{fill:#1d2433}.m{fill:#4a5468}.hd{font-weight:700}
</style>
