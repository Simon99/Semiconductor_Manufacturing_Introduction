<text class="t hd" x="30" y="474" font-size="16">閘極層（Gate layer）</text>
<text class="m" x="30" y="494" font-size="13">閘極（Gate，橘）疊在鰭（Fin，藍）上，</text>
<text class="m" x="30" y="510" font-size="13">接點（Contact，綠）</text>
<text class="m" x="30" y="526" font-size="13">CPP＝閘極到閘極的間距（Gate pitch）</text>
<text class="t hd" x="370" y="474" font-size="16">最密金屬層（Densest metal layer）</text>
<text class="m" x="370" y="494" font-size="13">導線（Wire，藍）</text>
<text class="m" x="370" y="510" font-size="13">MMP＝導線到導線的間距（Metal pitch）</text>
<text class="m" x="370" y="526" font-size="13">間距＝線寬＋間隔</text>
<rect x="700" y="130" width="230" height="320" rx="6" fill="#ffffff" stroke="#9aa3b5"/>
<text class="m" x="716" y="164" font-size="14">閘極間距（CPP）</text>
<text class="t hd oa" x="716" y="194" font-size="26">48 nm</text>
<text class="t hd ob" x="716" y="194" font-size="26">34 nm</text>
<text class="m" x="716" y="234" font-size="14">金屬間距（MMP）</text>
<text class="t hd oa" x="716" y="264" font-size="26">30 nm</text>
<text class="t hd ob" x="716" y="264" font-size="26">21 nm</text>
<text class="m" x="716" y="304" font-size="14">相對密度（Relative density）</text>
<text class="t hd oa" x="716" y="334" font-size="26">1.0x</text>
<text class="t hd ob" x="716" y="334" font-size="26">~2.0x</text>
<rect x="716" y="348" width="100" height="16" rx="3" fill="#2f8a5b" class="bar"/>
<text class="m" x="716" y="392" font-size="13">密度 ~ 1 / (CPP x MMP)</text>
<text class="m" x="716" y="410" font-size="13">0.7 x 0.7 = 0.49 倍面積，</text>
<text class="m" x="716" y="427" font-size="13">電晶體（Transistor）</text>
<text class="m" x="716" y="443" font-size="13">數量約為 2 倍</text>
<text class="m" x="30" y="544" font-size="13">數值僅為示意。「3 nm」等製程節點（Process node）名稱是世代代號，不是這些尺寸。</text>
