<ellipse cx="662.0" cy="276" rx="13" ry="16" fill="#c4cbd3" stroke="#59636e" stroke-width="1.5"/>
</g>
<g class="bl"><rect x="150" y="384" width="660" height="28" rx="3" fill="#2f6b4a" stroke="#1d4a31" stroke-width="1.5"/>
<rect x="215.0" y="380" width="40" height="4" fill="#e0b440"/><circle cx="235.0" cy="362" r="18" fill="#d5dae0" stroke="#59636e" stroke-width="1.5"/><ellipse cx="229.0" cy="355" rx="5" ry="3.5" fill="#fff" opacity=".7"/>
<rect x="285.0" y="380" width="40" height="4" fill="#e0b440"/><circle cx="305.0" cy="362" r="18" fill="#d5dae0" stroke="#59636e" stroke-width="1.5"/><ellipse cx="299.0" cy="355" rx="5" ry="3.5" fill="#fff" opacity=".7"/>
<rect x="355.0" y="380" width="40" height="4" fill="#e0b440"/><circle cx="375.0" cy="362" r="18" fill="#d5dae0" stroke="#59636e" stroke-width="1.5"/><ellipse cx="369.0" cy="355" rx="5" ry="3.5" fill="#fff" opacity=".7"/>
<rect x="425.0" y="380" width="40" height="4" fill="#e0b440"/><circle cx="445.0" cy="362" r="18" fill="#d5dae0" stroke="#59636e" stroke-width="1.5"/><ellipse cx="439.0" cy="355" rx="5" ry="3.5" fill="#fff" opacity=".7"/>
<rect x="495.0" y="380" width="40" height="4" fill="#e0b440"/><circle cx="515.0" cy="362" r="18" fill="#d5dae0" stroke="#59636e" stroke-width="1.5"/><ellipse cx="509.0" cy="355" rx="5" ry="3.5" fill="#fff" opacity=".7"/>
<rect x="565.0" y="380" width="40" height="4" fill="#e0b440"/><circle cx="585.0" cy="362" r="18" fill="#d5dae0" stroke="#59636e" stroke-width="1.5"/><ellipse cx="579.0" cy="355" rx="5" ry="3.5" fill="#fff" opacity=".7"/>
<rect x="635.0" y="380" width="40" height="4" fill="#e0b440"/><circle cx="655.0" cy="362" r="18" fill="#d5dae0" stroke="#59636e" stroke-width="1.5"/><ellipse cx="649.0" cy="355" rx="5" ry="3.5" fill="#fff" opacity=".7"/>
<rect x="705.0" y="380" width="40" height="4" fill="#e0b440"/><circle cx="725.0" cy="362" r="18" fill="#d5dae0" stroke="#59636e" stroke-width="1.5"/><ellipse cx="719.0" cy="355" rx="5" ry="3.5" fill="#fff" opacity=".7"/>
</g>
<g class="lab">
<text x="480" y="226" text-anchor="middle" style="fill:#fff;font-size:15px;font-weight:600">矽晶粒（Silicon die，背面朝上）</text>
<path class="ld" d="M712 225 H744"/><text class="lb" x="752" y="222">晶粒（已翻轉）</text><text class="ls" x="752" y="241">主動面（Active side）朝下</text>
<path class="ld" d="M676 270 H758"/><text class="lb" x="766" y="276">凸塊（Bump）</text><text class="ls" x="766" y="295" >連接晶粒與基板</text>
<path class="ld" d="M196 282 H240"/><text class="lb" x="190" y="287" text-anchor="end">底部填充（Underfill）</text>
<path class="ld" d="M194 316 H212"/><text class="lb" x="188" y="316" text-anchor="end">基板（Substrate）</text><text class="ls" x="188" y="334" text-anchor="end">扇出（Fan-out）</text><text class="ls" x="188" y="349" text-anchor="end">到較寬的間距</text>
<path class="ld" d="M744 362 H748"/><text class="lb" x="756" y="360">錫球（Solder ball）</text><text class="ls" x="756" y="379">連接封裝與電路板</text>
<text class="lb" x="150" y="434">電路板（Printed circuit board）</text>
</g>
<text class="cap c1" x="480" y="478">1  在晶粒焊墊（Bond pad）上做出凸塊（正面朝上）</text>
<text class="cap c2" x="480" y="478">2  晶粒翻轉成正面朝下</text>
<text class="cap c3" x="480" y="478">3  凸塊焊接到基板焊墊</text>
<text class="cap c4" x="480" y="478">4  底部填充膠流入縫隙並固化，分散應力</text>
<text class="cap c5" x="480" y="478">5  底面的錫球把封裝連接到電路板</text>
<rect x="80" y="516" width="800" height="4" rx="2" fill="#d3dae3"/><rect class="pg" x="80" y="516" width="800" height="4" rx="2" fill="#3b7dd8"/>
</g></svg>