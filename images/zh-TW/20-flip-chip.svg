<rect x="438.0" y="292" width="32" height="5" fill="#e0b440"/><rect x="425.0" y="340" width="40" height="5" fill="#e0b440"/>
<polyline points="506.0,296 506.0,310 515.0,326 515.0,340" fill="none" stroke="#c99a2e" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="490.0" y="292" width="32" height="5" fill="#e0b440"/><rect x="495.0" y="340" width="40" height="5" fill="#e0b440"/>
<polyline points="558.0,296 558.0,310 585.0,326 585.0,340" fill="none" stroke="#c99a2e" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="542.0" y="292" width="32" height="5" fill="#e0b440"/><rect x="565.0" y="340" width="40" height="5" fill="#e0b440"/>
<polyline points="610.0,296 610.0,310 655.0,326 655.0,340" fill="none" stroke="#c99a2e" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="594.0" y="292" width="32" height="5" fill="#e0b440"/><rect x="635.0" y="340" width="40" height="5" fill="#e0b440"/>
<polyline points="662.0,296 662.0,310 725.0,326 725.0,340" fill="none" stroke="#c99a2e" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="646.0" y="292" width="32" height="5" fill="#e0b440"/><rect x="705.0" y="340" width="40" height="5" fill="#e0b440"/>
</g>
<g class="uf"><polygon points="250,260 710,260 738,292 222,292" fill="#f0b43c" fill-opacity="0.7" stroke="#c98b12" stroke-width="1.2"/></g>
