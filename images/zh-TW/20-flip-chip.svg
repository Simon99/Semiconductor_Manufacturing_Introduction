<text class="ls" x="480" y="136" text-anchor="middle" style="fill:#b23b37">熱量從晶粒（Die）背面散出</text></g>
<g id="substrate"><rect x="200" y="292" width="560" height="52" rx="3" fill="#7fb98f" stroke="#3f7a52" stroke-width="1.5"/>
