<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant-TW" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
<title id="t">覆晶封裝（Flip-chip package）剖面：組裝順序</title>
<desc id="d">帶有凸塊（Bump）的晶粒（Die）翻轉成正面朝下，放到基板（Substrate）上，縫隙填入底部填充膠（Underfill），最後在底面植上錫球（Solder ball）。</desc>
<style>
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d2a38}
.ti{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#55657a}
.lb{font-size:16px;font-weight:600}.ls{font-size:13px;font-weight:400;fill:#4a5a6e}
.cap{font-size:20px;font-weight:600;text-anchor:middle}
.ld{stroke:#1d2a38;stroke-width:1.5;fill:none}
.scene{animation:sc 14s infinite linear;opacity:1}
.die{animation:die 14s infinite;transform-origin:480px 220px}
.uf{animation:uf 14s infinite linear;transform-origin:222px 276px}
.bl{animation:bl 14s infinite}
.lab{animation:lab 14s infinite linear}
.ht{animation:ht 14s infinite linear}
.pg{animation:pg 14s infinite linear;transform-origin:80px 518px}
.c1,.c2,.c3,.c4{opacity:0}.c5{opacity:1}
.c1{animation:c1 14s infinite linear}.c2{animation:c2 14s infinite linear}
.c3{animation:c3 14s infinite linear}.c4{animation:c4 14s infinite linear}.c5{animation:c5 14s infinite linear}
@keyframes sc{0%{opacity:0}2%{opacity:1}96%{opacity:1}100%{opacity:0}}
@keyframes die{0%,12%{transform:translateY(-70px) scaleY(-1);animation-timing-function:ease-in-out}
30%{transform:translateY(-70px) scaleY(1);animation-timing-function:ease-in}
46%,100%{transform:translateY(0) scaleY(1)}}
@keyframes uf{0%,46%{transform:scaleX(0)}68%,100%{transform:scaleX(1)}}
@keyframes bl{0%,68%{opacity:0;transform:translateY(-16px)}76%,100%{opacity:1;transform:translateY(0)}}
@keyframes lab{0%,50%{opacity:0}58%,100%{opacity:1}}
@keyframes ht{0%,80%{opacity:0}88%,100%{opacity:1}}
@keyframes pg{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes c1{0%,12%{opacity:1}14%,100%{opacity:0}}
@keyframes c2{0%,12%{opacity:0}14%,30%{opacity:1}32%,100%{opacity:0}}
@keyframes c3{0%,30%{opacity:0}32%,46%{opacity:1}48%,100%{opacity:0}}
@keyframes c4{0%,46%{opacity:0}48%,67%{opacity:1}69%,100%{opacity:0}}
@keyframes c5{0%,67%{opacity:0}69%,97%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.scene,.die,.uf,.bl,.lab,.ht,.pg,.c1,.c2,.c3,.c4,.c5{animation:none!important}}
</style>
<rect width="960" height="540" fill="#f6f8fb"/>
<text class="ti" x="40" y="38">覆晶封裝（Flip-chip package）剖面</text>
<text class="sub" x="40" y="60">示意，未依比例</text>
<g class="scene">

