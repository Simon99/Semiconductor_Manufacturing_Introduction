<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant-TW" viewBox="0 0 960 525" width="960" height="525" role="img" aria-labelledby="t d">
<title id="t">2.5D 封裝剖面圖</title>
<desc id="d">處理器與 HBM 堆疊並排放在矽中介層上，中介層再置於封裝基板上。資料點沿著中介層上大量的短導線流動；下方則是同樣兩顆晶片放在電路板上，僅以少數幾條長走線相連。</desc>
<style>
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2a37}
.lb{font-size:13px}.sm{font-size:12px}.hd{font-size:16px;font-weight:700}.w{fill:#fff}
.dot{fill:#ff7a00;stroke:#7a2e00;stroke-width:.8;transform:translateX(var(--s))}
.r1{animation:fr 1.5s linear infinite}.l1{animation:fl 1.5s linear infinite}
.rb{animation:fb 2.9s linear infinite}.lb2{animation:fbl 2.9s linear infinite}
@keyframes fr{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(250px);opacity:0}}
@keyframes fl{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(-250px);opacity:0}}
@keyframes fb{0%{transform:translateX(0);opacity:0}5%{opacity:1}95%{opacity:1}100%{transform:translateX(460px);opacity:0}}
@keyframes fbl{0%{transform:translateX(0);opacity:0}5%{opacity:1}95%{opacity:1}100%{transform:translateX(-460px);opacity:0}}
.pulse{animation:pl 6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.0}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.r1,.l1,.rb,.lb2,.pulse{animation:none!important}.dot{opacity:1}.pulse{opacity:.6}}
</style>
